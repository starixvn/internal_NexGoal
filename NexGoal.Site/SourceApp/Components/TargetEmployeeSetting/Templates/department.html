<div ng-controller="TargetDepartmentSettingController as departmentCtrl">
    <form novalidate class="form-inline filter">
        <div class="form-group">
            <div class="col">
                <label class="control-label size" data-translate="Team"></label>
                <div class="control-content">
                    <select ng-model="departmentCtrl.filter.departmentId" ng-options="opt.DepartmentId as opt.Name for opt in departmentCtrl.treeDepartment"
                            class="form-control lstBox-limit" ng-change="departmentCtrl.updateIsGroup(departmentCtrl.filter.departmentId)">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>                
            </div>

            <div class="col">
                <label class="control-label size" data-translate="Type"></label>
                <div class="control-content">
                    <select class="form-control lstBox-limit" ng-model="departmentCtrl.filter.targetTypeId"
                            ng-options="opt.TargetTypeId as opt.Name for opt in departmentCtrl.targetTypes">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>                
            </div>

            <div class="col">
                <div class="control-label size-m">
                    <input  type="checkbox" ng-model="departmentCtrl.filter.showAll" id="chbShowAll" />
                    <label data-translate="ShowAll" for="chbShowAll"></label>
                </div>   
            </div>

            <div class="col">
                <button class="button" ng-click="departmentCtrl.query(departmentCtrl.filter)" data-translate="Search"></button>
            </div>
        </div>        
    </form>

    <table class="row table table-bordered table-striped target-setting-template" id="data">
        <thead>
            <tr class="header-table">
                <th colspan="6">
                    <div class="pull-left div-target-templatesetting" ng-if="targetCtrl.permission == targetCtrl.policyEnum.Host">
                        <label class="control-label" data-translate="EvaluationTemplate">
                        </label>
                        <select ng-model="departmentCtrl.targetDepartmentSetting.targetTemplateId" 
                                ng-options="opt.TargetTemplateId as opt.Name for opt in departmentCtrl.targetTemplates"
                                class="target-template-setting-select lstBox-limit"></select>
                    </div>
                    <button class="button pull-left btn-assign" data-translate="Assign" ng-click="departmentCtrl.assignTargetTemplate()" 
                            ng-if="targetCtrl.permission == targetCtrl.policyEnum.Host"></button>
                    <input type="text" ng-model="departmentCtrl.searchKey" ng-change="departmentCtrl.search()" class="search-inline-textbox search pull-right">
                </th>
            </tr>
            <tr class="headerName">
                <th>
                    <input type="checkbox" ng-click="departmentCtrl.checkAll(departmentCtrl.selectedAll)"
                           ng-model="departmentCtrl.selectedAll" />
                </th>
                <th data-translate="SymbolCount">
                </th>
                <th data-translate="Team">
                </th>
                <th data-translate="Type">
                </th>
                <th data-translate="EvaluationTemplate">
                </th>
                <th data-translate="Delete" ng-if="targetCtrl.permission == targetCtrl.policyEnum.Host">
                </th>
            </tr>
        </thead>
            <tbody class="table-body" dir-paginate="department in departmentCtrl.filteredItems | itemsPerPage: departmentCtrl.pageSize"
                pagination-id="department" current-page="departmentCtrl.currentPage" ng-class="{oddRow: $index % 2 == 0, evenRow: $index % 2 != 0}">
            <tr ng-repeat="targetTemplate in department.TargetTemplates" ng-if="department.TargetTemplates.length > 0">
                <td class="text-center" rowspan="{{department.NumberTargetTemplates}}" ng-if="$first">
                    <input type="checkbox" ng-model="department.Selected" ng-click="departmentCtrl.syncSelectedDepartment(department, department.Selected)" />
                </td>
                <td class="text-center" ng-bind="departmentCtrl.getIndex($parent.$index, departmentCtrl.currentPage, departmentCtrl.pageSize)"
                    ng-if="$first" rowspan="{{department.NumberTargetTemplates}}"></td>
                <td ng-bind="department.Name" ng-if="$first" rowspan="{{department.NumberTargetTemplates}}"></td>
                <td ng-bind="targetTemplate.TargetTypeName"></td>
                <td ng-bind="targetTemplate.Name"></td>
                <td class="text-center" ng-if="targetCtrl.permission == targetCtrl.policyEnum.Host">
                    <a class="fa fa-trash-o icon-remove" ng-click="departmentCtrl.deleteTargetTemplate(department, targetTemplate)"
                       ng-attr-title='{{"Delete" | translate}}'></a>
                </td>
            </tr>
            <tr ng-if="department.TargetTemplates.length == 0">
                <td class="text-center">
                    <input type="checkbox" ng-model="department.Selected" ng-click="departmentCtrl.syncSelectedDepartment(department, department.Selected)" />
                </td>
                <td class="text-center" ng-bind="departmentCtrl.getIndex($index, departmentCtrl.currentPage, departmentCtrl.pageSize)"></td>
                <td ng-bind="department.Name"></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
        <tbody ng-if="departmentCtrl.filteredItems.length == 0">
            <tr>
                <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="6" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry" ng-model="departmentCtrl.pageSize"
                            ng-options="entry for entry in departmentCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true" pagination-id="department"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
