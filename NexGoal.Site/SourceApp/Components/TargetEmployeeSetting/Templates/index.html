<div ng-controller="TargetSettingTemplateController as targetCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="TargetEmployeeSettingTemplate"></li>
            </ul>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset id="TargetTemplateTab">
                <tab heading="TEAM" class="tab-cursor" active="targetCtrl.dataTab.department" select="targetCtrl.tabDepartmentSelect()">
                    <div ng-include src="'/SourceApp/Components/TargetEmployeeSetting/Templates/department.html'"></div>
                </tab>
                <tab heading="PERSONAL" class="tab-cursor" active="targetCtrl.dataTab.personnel" select="targetCtrl.tabPersonnelSelect()">
                    <div ng-include src="'/SourceApp/Components/TargetEmployeeSetting/Templates/personnel.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
