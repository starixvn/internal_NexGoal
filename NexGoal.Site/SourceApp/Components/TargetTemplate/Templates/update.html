<div ng-controller="UpdateTargetTemplateController as updateCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="EditTargetTemplate"></li>
            </ul>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset id="TargetTemplateTab">
                <tab heading="GENERAL INFORMATION" class="tab-cursor" active="updateCtrl.dataTab.information" select="updateCtrl.tabInfoSelect()">
                    <div ng-include src="'/SourceApp/Components/TargetTemplate/Templates/generalInformation.html'"></div>
                </tab>
                <tab heading="KPI LIST" class="tab-cursor" active="updateCtrl.dataTab.kpi" select="updateCtrl.tabKPISelect()">
                    <div ng-include src="'/SourceApp/Components/TargetTemplate/Templates/KPIList.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
