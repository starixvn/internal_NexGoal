<div ng-controller="TargetTemplateController as targetTemplateCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="TargetTemplateManagement"></li>
            </ul>
        </div>
        <div class="col-sm-12">
            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label" data-translate="Type"></label>
                        <div class="control-content">
                            <select class="form-control lstBox-limit" ng-model="targetTemplateCtrl.filter.targetTypeId"
                                    ng-options="opt.TargetTypeId as opt.Name for opt in targetTemplateCtrl.targetTypes">
                                <option value="">-- {{"All" | translate}} --</option>
                            </select>
                        </div>                        
                    </div>  
                    
                    <div class="col">
                        <label class="control-label" data-translate="Status"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="targetTemplateCtrl.filter.isActive">
                                <option value="">-- {{"All" | translate}} --</option>
                                <option selected value="true" data-translate="Active"></option>
                                <option value="false" data-translate="InActive"></option>
                            </select>
                        </div>                        
                    </div>  
                    
                    <div class="col">
                        <button class="button" ng-click="targetTemplateCtrl.query(targetTemplateCtrl.filter)" data-translate="Submit"></button>
                    </div>                
                </div>  
            </form>

            <table class="row table table-bordered table-striped">
                <thead>
                    <tr class="header-table">
                        <th colspan="9">
                            <a class="pull-left button-icon create-button" ng-click="targetTemplateCtrl.create()"
                               ng-if="targetTemplateCtrl.permission == targetTemplateCtrl.policyEnum.Host">
                                <span class="icon plus"></span>
                                <span class="button-text" data-translate="CreateTargetTemplate"></span>
                            </a>
                            <input type="text" ng-model="targetTemplateCtrl.searchKey" ng-change="targetTemplateCtrl.search()" class="search-inline-textbox search pull-right">
                        </th>
                    </tr>
                    <tr class="headerName">
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="Name"></th>
                        <th data-translate="Type"></th>
                        <th data-translate="ScoreRatingType"></th>
                        <th data-translate="RatingType"></th>
                        <th data-translate="Description"></th>
                        <th data-translate="KPIs"></th>
                        <th data-translate="Active"></th>
                        <th data-translate="Action" ng-if="targetTemplateCtrl.permission == targetTemplateCtrl.policyEnum.Host"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="targetTemplate in targetTemplateCtrl.filteredItems | itemsPerPage: targetTemplateCtrl.pageSize" current-page="targetTemplateCtrl.currentPage">
                        <td class="text-center" ng-bind="targetTemplateCtrl.getIndex($index, targetTemplateCtrl.currentPage, targetTemplateCtrl.pageSize)"></td>
                        <td class="column-limit">
                            <a ng-click="targetTemplateCtrl.detail(targetTemplate)" ng-bind="targetTemplate.Name"></a>
                        </td>
                        <td class="text-center" ng-bind="targetTemplate.TargetTypeName"></td>
                        <td class="text-center" ng-bind="targetTemplate.ScoreRatingTypeName"></td>
                        <td class="text-center" ng-bind="targetTemplate.RatingTypeName"></td>
                        <td class="col-description">
                            {{targetTemplate.Description | limitTo: targetTemplate.numLimit > 0 ? targetTemplate.numLimit: targetTemplateCtrl.maxLengthDescription}}
                            <a ng-show="!targetTemplate.showReadMore && (targetTemplate.Description.length >= targetTemplateCtrl.maxLengthDescription)"
                               ng-click="targetTemplateCtrl.readMore(targetTemplate)" data-translate="ReadMore"></a>
                            <a ng-show="targetTemplate.showReadMore && (targetTemplate.Description.length >= targetTemplateCtrl.maxLengthDescription)"
                               ng-click="targetTemplateCtrl.readLess(targetTemplate)" data-translate="ReadLess"></a>
                        </td>
                        <td class="text-center">
                            <a ng-if="targetTemplateCtrl.permission == targetTemplateCtrl.policyEnum.Host"
                               ng-click="targetTemplateCtrl.update(targetTemplate, true)" ng-bind="targetTemplate.KPIs">
                            </a>
                        </td>
                        <td class="text-center">
                            <input type="checkbox" ng-checked="targetTemplate.IsActive" ng-click="targetTemplateCtrl.confirmActive(targetTemplate)"
                                   ng-disabled="targetTemplateCtrl.permission != targetTemplateCtrl.policyEnum.Host" />
                        </td>
                        <td class="target-template-action text-center" ng-if="targetTemplateCtrl.permission == targetTemplateCtrl.policyEnum.Host">
                            <div class="btn-group">
                                <a class="fa fa-pencil-square-o icon-edit" title="Edit"
                                   ng-click="targetTemplateCtrl.update(targetTemplate)"></a>
                                <a class="fa fa-trash-o icon-remove" title="Delete" ng-click="targetTemplateCtrl.deleteTargetTemplate(targetTemplate)"></a>
                            </div>
                        </td>
                    </tr>
                    <tr ng-show="targetTemplateCtrl.filteredItems.length == 0">
                        <td class="empty-result" colspan="9" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="9" class="paging">
                            <span data-translate="Show"></span>
                            <select class="dropdown-entry" ng-model="targetTemplateCtrl.pageSize"
                                    ng-options="entry for entry in targetTemplateCtrl.entries"></select>
                            <span data-translate="entries"></span>
                            <div class="pull-right custom-paging">
                                <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                            </div>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
