<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="CreateTargetTemplate"></span>
            <span class="close-popup" ng-click="createTargetTemplateCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">
            <div class="form-group required">
                <label class="col-sm-4 control-label" data-translate="Name">
                </label>
                <div class="col-sm-8">
                    <input type="text" class="form-control" ng-model="createTargetTemplateCtrl.targetTemplate.Name" required maxlength="200" />
                </div>
            </div>
            <div class="form-group top-buffer required">
                <label class="col-sm-4 control-label" data-translate="Type">
                </label>
                <div class="col-sm-8">
                    <select class="form-control" ng-options="targetType.TargetTypeId as targetType.Name for targetType in createTargetTemplateCtrl.targetTypes"
                            ng-model="createTargetTemplateCtrl.targetTemplate.TargetTypeId" required name="targetType">
                        <option value="">-- {{"Select" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group top-buffer required">
                <label class="col-sm-4 control-label" data-translate="ScoreRatingType">
                </label>
                <div class="col-sm-8">
                    <select class="form-control" ng-options="scoreType.ScoreRatingTypeId as scoreType.Name for scoreType in createTargetTemplateCtrl.scoreRatingTypeOptions"
                            ng-model="createTargetTemplateCtrl.targetTemplate.ScoreRatingTypeId"></select>
                </div>
            </div>
            <div class="form-group top-buffer required">
                <label class="col-sm-4 control-label" data-translate="RatingType">
                </label>
                <div class="col-sm-8">
                    <select class="form-control" ng-options="type.RatingTypeId as type.Name for type in createTargetTemplateCtrl.ratingTypes"
                            ng-model="createTargetTemplateCtrl.targetTemplate.RatingTypeId" required></select>
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-4 control-label" data-translate="Active"></label>
                <div class="col-sm-8 field active-label">
                    <input ng-model="createTargetTemplateCtrl.targetTemplate.IsActive" type="checkbox">
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-4 control-label" data-translate="Description">
                </label>
                <div class="col-sm-8">
                    <textarea class="form-control none-resize" ng-model="createTargetTemplateCtrl.targetTemplate.Description" id="description"
                              maxlength="500" rows="5"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="createTargetTemplateCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="createTargetTemplateCtrl.save()" data-translate="Submit"></button>
    </div>
</div>
