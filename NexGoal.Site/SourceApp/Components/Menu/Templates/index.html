<ul class="list-group" ng-controller="MenuController as menuCtrl">
    <li class="list-group-item"
        ng-class="{'has-sub': menu.MenuItems.length > 0, 'no-sub': menu.MenuItems.length === 0}"
        ng-repeat="menu in menuCtrl.menus | orderBy:'-DisplayOrder':true">

        <a class="sub-menu-title"
           data-toggle="collapse"
           data-target=".menu-{{::$index}}"
           ng-if="menu.MenuItems.length > 0">
            <i class="fa fa-{{::menu.Name | lowercase}}"></i>{{::menu.Text}}<i class="fa fa-chevron-down pull-right"></i>
        </a>

        <ul class="list-group collapse in menu-{{::$index}}"
            ng-if="menu.MenuItems.length > 0">
            <li class="list-group-item sub-menu" ng-repeat="subMenu in menu.MenuItems | orderBy: '-DisplayOrder':true">
                <a hef="" data-menu-tab data-link="{{::subMenu.Link}}">{{::subMenu.Text}}</a>
            </li>
        </ul>

        <a ng-if="menu.MenuItems.length ===  0 && menu.Link.length > 0" data-menu-tab data-link="{{::menu.Link}}">
            <i class="fa fa-{{::menu.Name | lowercase}}"></i>{{::menu.Text}}
        </a>
    </li>
</ul>
