<div class="custom-modal">
    <div id="adjustScorePopup">
        <div class="modal-header">
            <div class="popup-header">
                {{"AdjustScore" | translate}}
                <span class="close-popup" ng-click="modalAdjustScoreCtrl.cancel()"></span>
            </div>
        </div>
        <div class="modal-body modal-adjust-score">
                <form class="form-horizontal" role="form">
                    <div class="form-group required">
                        <label class="col-sm-2 control-label" data-translate="Score"></label>
                        <div class="col-sm-4 field">
                            <input type="text" maxlength="6" class="form-control text-center epa-input-score" 
                                   ng-model="modalAdjustScoreCtrl.adjust.Score" required numeric decimals="2" min="-10" max="10" 
                                   tooltip="{{modalAdjustScoreCtrl.scoreInputValidMessage}}"/>
                        </div>
                    </div>
                    <div class="form-group required">
                        <label class="col-sm-2 control-label" data-translate="Comment"></label>
                        <div class="col-sm-10 field">
                            <textarea type="text" class="form-control none-resize" required rows="20"
                                      ng-model="modalAdjustScoreCtrl.adjust.Comment" ></textarea>
                        </div>
                    </div>
                </form>
        </div>
        <div class="modal-footer">
            <button class="button btn-cancel" ng-click="modalAdjustScoreCtrl.cancel()" data-translate="Cancel"></button>
            <button class="button" ng-click="modalAdjustScoreCtrl.ok()" data-translate="Submit"></button>
        </div>
    </div>
</div>
