<div ng-controller="ViewEPADetailController as memberEPAInfoCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header" id="titleSection">
            <ul class="row breadcrumb">
                <li class="current" data-translate="EPAResult"></li>
            </ul>
        </div>

        <div class="col-sm-12">

            <div class="row epa-form">

                <div class="text-center epa-title">{{"EPATilte" | translate}} ({{memberEPAInfoCtrl.epaInfo.Period.Name}})</div>

                <div class="panel-group dashboard">

                    <div class="panel panel-default no-border">

                        <div class="panel-heading level-2" data-toggle="collapse" data-target=".performance-review-panel">
                            <h4 class="panel-title">{{"PerformanceReview" | translate}} ({{memberEPAInfoCtrl.epaInfo.Employee.Code}} - {{memberEPAInfoCtrl.epaInfo.Employee.FullName}})</h4>
                            <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                        </div>

                        <div class="panel-collapse collapse in performance-review-panel">
                            <div class="panel-body">
                                <div ng-include src="'/SourceApp/Components/EPA/Templates/ratingInstruction.html'"></div>
                                <div class="rating-note no-border">
                                    <span data-translate="EvaluationProcess"></span>
                                </div>
                                <div class="evaluation-process-section" ng-include src="'/SourceApp/Components/EPA/Templates/evaluationProcess.html'"></div>
                            </div>
                        </div>

                    </div>

                    <div class="panel panel-default no-border">

                        <div class="panel-heading level-1" data-toggle="collapse" data-target=".discipline-information-panel">
                            <h4 class="panel-title" data-translate="ApproachToWork"></h4>
                            <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                        </div>

                        <div class="panel-collapse collapse in discipline-information-panel">
                            <div class="panel-body" ng-include src="'/SourceApp/Components/EPA/Templates/disciplineInformation.html'">
                            </div>
                        </div>

                    </div>

                    <div class="panel panel-default no-border">

                        <div class="panel-heading level-1" data-toggle="collapse" data-target=".employee-panel">
                            <h4 class="panel-title" data-translate="ForEmployeeUse"></h4>
                            <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                        </div>

                        <div class="panel-collapse collapse in employee-panel">
                            <div class="panel-body" ng-include src="'/SourceApp/Components/EPA/Templates/employeeEfficiencyInfo.html'">
                            </div>
                        </div>

                    </div>

                    <div class="panel panel-default no-border">

                        <div class="panel-heading level-1" data-toggle="collapse" data-target=".performance-result-panel">
                            <h4 class="panel-title" data-translate="PerformanceResult"></h4>
                            <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                        </div>

                        <div class="panel-collapse collapse in performance-result-panel">
                            <div class="panel-body">
                                <div ng-include src="'/SourceApp/Components/EPA/Templates/performanceResult.html'">
                                </div>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

            <div class="navbar navbar-default navbar-fixed-bottom action-section"
                 ng-class="{'full-size': !menuVisibility}">
                <button class="btn btn-back" ng-click="memberEPAInfoCtrl.back()" data-translate="Back"></button>
            </div>
        </div>
    </div>
</div>
