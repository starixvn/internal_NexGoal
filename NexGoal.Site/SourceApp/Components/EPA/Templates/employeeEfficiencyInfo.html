<div ng-if="memberEPAInfoCtrl.epaInfo.Period.TargetTypeId == memberEPAInfoCtrl.targetTypeEnum.SemiAnnual">
    <div class="level-2" data-toggle="collapse" data-target=".project-efficiency-table">
        A. {{"ProjectEfficiency" | translate}}
        <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
    </div>

    <div class="collapse in project-efficiency-table">

        <table class="table table-bordered pa-form">
            <thead>
                <tr>
                    <th>#</th>
                    <th data-translate="ProjectName"></th>
                    <th data-translate="Target"></th>
                    <th data-translate="ProjectManager"></th>
                    <th data-translate="StartDate"></th>
                    <th data-translate="EndDate"></th>
                    <th data-translate="Role"></th>
                    <th data-translate="TotalSpentTime"></th>
                    <th data-translate="Score"></th>
                    <th data-translate="Comment"></th>
                </tr>
            </thead>
            <tbody>
                <tr ng-if="memberEPAInfoCtrl.employeeProjects.length === 0">
                    <td colspan="10" data-translate="EmptyResult" class="empty-result"></td>
                </tr>
                <tr ng-repeat="project in memberEPAInfoCtrl.employeeProjects" ng-if="memberEPAInfoCtrl.employeeProjects.length > 0">
                    <td class="text-center">{{$index + 1}}</td>
                    <td ng-bind="project.ProjectName"></td>
                    <td ng-bind="project.TargetName"></td>
                    <td class="text-center" ng-bind="project.ProjectManagerName"></td>
                    <td class="text-center" ng-bind="project.StartDate | customDate"></td>
                    <td class="text-center" ng-bind="project.EndDate | customDate"></td>
                    <td class="text-center" ng-bind="project.Roles"></td>
                    <td class="text-center" ng-bind="project.WorkingHour"></td>
                    <td class="text-center">
                        <span ng-if="project.DecryptedScore !== null && project.DecryptedScore.length > 0">
                            {{project.DecryptedScore}} <i class="fa fa-star"></i>
                        </span>
                        <span ng-if="project.DecryptedScore === null || project.DecryptedScore.length === 0">-</span>
                    </td>
                    <td class="comment-wrapper"
                        ng-class="{'text-center': project.Comment === null || project.Comment.length === 0}">
                        <span ng-if="project.Comment.length > 50"
                              tooltip-html-unsafe='<div class="pre-line-tooltip">{{project.Comment}}</div>'
                              tooltip-placement="left">
                            {{project.Comment | limitTo : 50}} ...
                        </span>
                        <span ng-if="project.Comment.length <= 50 && project.Comment.length > 0">
                            {{project.Comment}}
                        </span>
                        <span ng-if="project.Comment === null || project.Comment.length === 0">-</span>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</div>
