<div class="rating-note">
    <span data-translate="PerformanceRatingNote"></span>
</div>

<div class="rating-block rating-title">

    <div class="col text-center">{{::memberEPAInfoCtrl.epaInfo.Employee.FullName}}</div>
    <div class="col text-center" data-translate="NotAvai">
    </div>
    <div class="col text-center">
        <span class="introduction-title">{{"OneRating" | translate}}</span>
        <div class="star-group">
            <span class="star" ng-repeat="n in [] | range: 2">
                <i class="fa fa-star"></i>
            </span>
        </div>
    </div>
    <div class="col text-center">
        <span class="introduction-title">{{"TwoRating" | translate}}</span>
        <div class="star-group">
            <span class="star" ng-repeat="n in [] | range: 3">
                <i class="fa fa-star"></i>
            </span>
        </div>
    </div>
    <div class="col text-center">
        <span class="introduction-title">{{"ThreeRating" | translate}}</span>
        <div class="star-group">
            <span class="star" ng-repeat="n in [] | range: 4">
                <i class="fa fa-star"></i>
            </span>
        </div>
    </div>
    <div class="col text-center">
        <span class="introduction-title">{{"FourRating" | translate}}</span>
        <div class="star-group">
            <span class="star" ng-repeat="n in [] | range: 5">
                <i class="fa fa-star"></i>
            </span>
        </div>
    </div>
    <div class="col text-center">
        <span class="introduction-title">{{"FiveRating" | translate}}</span>
        <div class="star-group">
            <span class="star" ng-repeat="n in [] | range: 6">
                <i class="fa fa-star"></i>
            </span>
        </div>
    </div>

</div>

<div class="rating-block rating-detail">

    <div class="col text-center">
        <img class="img-border" src="{{::memberEPAInfoCtrl.epaInfo.Employee.Avatar}}" />
    </div>

    <div class="col" data-translate="NARatingDescription"></div>
    <div class="col" data-translate="OneRatingDescription"></div>
    <div class="col" data-translate="TwoRatingDescription"></div>
    <div class="col" data-translate="ThreeRatingDesciption"></div>
    <div class="col" data-translate="FourRatingDescription"></div>
    <div class="col" data-translate="FiveRatingDescription"></div>

</div>
