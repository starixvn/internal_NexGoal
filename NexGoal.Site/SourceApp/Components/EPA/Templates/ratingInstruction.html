<div class="rating-block rating-title">

    <div class="col text-center">Nguyễn Hoàng Nguyên</div>
    <div class="col text-center" data-translate="NotAvai"></div>
    <div class="col text-center" data-translate="OneRating"></div>
    <div class="col text-center" data-translate="TwoRating"></div>
    <div class="col text-center" data-translate="ThreeRating"></div>
    <div class="col text-center" data-translate="FourRating"></div>
    <div class="col text-center" data-translate="FiveRating"></div>

</div>

<div class="rating-block rating-detail">

    <div class="col text-center">
        <img class="img-border" src="./SourceApp/Components/EPA/avatar-employee.png" />
    </div>
    <div class="col" data-translate="NARatingDescription"></div>
    <div class="col" data-translate="OneRatingDescription"></div>
    <div class="col" data-translate="TwoRatingDescription"></div>
    <div class="col" data-translate="ThreeRatingDesciption"></div>
    <div class="col" data-translate="FourRatingDescription"></div>
    <div class="col" data-translate="FiveRatingDescription"></div>

</div>
