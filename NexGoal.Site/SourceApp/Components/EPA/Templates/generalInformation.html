<div class="img-user">
    <img class="img-default" ng-src="{{memberEPAInfoCtrl.epaInfo.Employee.Avatar}}" alt="User" />
</div>

<div class="info-user">

    <div class="row row-item line">
        <div class="info-item">
            <div class="info-label"><strong data-translate="EmployeeCode"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.Code"></span>
            </div>
        </div>
        <div class="info-item">
            <div class="info-label"><strong data-translate="NickName"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.NickName"></span>
            </div>
        </div>
    </div>

    <div class="row row-item line">
        <div class="info-item">
            <div class="info-label"><strong data-translate="FullName"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.FullName"></span>
            </div>
        </div>
        <div class="info-item">
            <div class="info-label"><strong data-translate="JobTitle"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.JobTitleName"></span>
            </div>
        </div>
    </div>

    <div class="row row-item line">
        <div class="info-item">
            <div class="info-label"><strong data-translate="Department"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.DepartmentName"></span>
            </div>
        </div>
        <div class="info-item">
            <div class="info-label"><strong data-translate="Team"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.GroupName"></span>
            </div>
        </div>
    </div>

    <div class="row row-item line">
        <div class="info-item">
            <div class="info-label"><strong data-translate="JoinedDate"></strong></div>
            <div class="info-detail">
                <span ng-bind="memberEPAInfoCtrl.epaInfo.Employee.JoinedDate | customDate"></span>
            </div>
        </div>
        <div class="info-item">
            <div class="info-label"><strong data-translate="Evaluated"></strong></div>
            <div class="info-detail">
                <span class="glyphicon glyphicon-saved epa-saved"
                      ng-if="memberEPAInfoCtrl.evaluatedDate || memberEPAInfoCtrl.dataSaved"></span>
                <span class="glyphicon glyphicon-list-alt epa-unsaved"
                      ng-if="memberEPAInfoCtrl.evaluatedDate == null && !memberEPAInfoCtrl.dataSaved"></span>
            </div>
        </div>
    </div>

</div>
