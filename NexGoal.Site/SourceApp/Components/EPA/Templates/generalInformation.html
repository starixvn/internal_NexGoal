<div class="col-sm-2 text-center">
    <div class="img-user">
        <img class="img-default" ng-src="{{memberEPAInfoCtrl.epaInfo.Employee.Avatar}}" alt="User" />
    </div>
</div>
<div class="col-sm-10">
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="EmployeeCode"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.Code"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="NickName"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.NickName"></strong>
            </div>
        </div>
    </div>
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="FullName"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.FullName"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="JobTitle"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.JobTitleName"></strong>
            </div>
        </div>
    </div>
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="Department"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.DepartmentName"></strong>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="Team"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.GroupName"></strong>
            </div>
        </div>
    </div>
    <div class="row row-item line">
        <div class="col-sm-6">
            <div class="col-sm-4">
                <strong data-translate="JoinedDate"></strong>
            </div>
            <div class="col-sm-7">
                <strong ng-bind="memberEPAInfoCtrl.epaInfo.Employee.JoinedDate | customDate"></strong>
            </div>
        </div>
        <div class="col-sm-6" ng-show="!memberEPAInfoCtrl.isViewDetail">
            <div class="col-sm-4">
                <strong data-translate="Evaluated"></strong>
            </div>
            <div class="col-sm-7">
                <span class="glyphicon glyphicon-saved epa-saved"
                      ng-show="memberEPAInfoCtrl.evaluatedDate || memberEPAInfoCtrl.dataSaved"></span>
                <span class="glyphicon glyphicon-list-alt epa-unsaved"
                      ng-show="memberEPAInfoCtrl.evaluatedDate == null && !memberEPAInfoCtrl.dataSaved"></span>
            </div>
        </div>
    </div>
</div>
