<div class="custom-modal">
    <div id="updateCommentPopup">
        <div class="modal-header">
            <div class="popup-header">
                <span ng-show="modalUpdateCommentCtrl.isEdit">{{"EditComment" | translate}}</span>
                <span ng-show="!modalUpdateCommentCtrl.isEdit">{{"ViewComment" | translate}}</span>
                <span class="close-popup" ng-click="modalUpdateCommentCtrl.cancel()"></span>
            </div>
        </div>
        <div class="modal-body">
            <form class="form-horizontal" role="form">
                <div class="form-group">
                    <label class="col-sm-2 control-label">
                        <span data-translate="Comment"></span>
                        <span data-translate="(*)" class="note"
                              ng-show="modalUpdateCommentCtrl.isEdit"></span>
                    </label>
                    <div class="col-sm-10 field">
                        <textarea type="text" class="form-control none-resize" required rows="20"
                                  ng-readonly="!modalUpdateCommentCtrl.isEdit"
                                  ng-model="modalUpdateCommentCtrl.comment"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="button btn-cancel"
                    ng-if="modalUpdateCommentCtrl.isEdit"
                    ng-click="modalUpdateCommentCtrl.cancel()" data-translate="Cancel"></button>
            <button class="button btn-cancel"
                    ng-if="!modalUpdateCommentCtrl.isEdit"
                    ng-click="modalUpdateCommentCtrl.cancel()" data-translate="Close"></button>
            <button class="button"
                    ng-show="modalUpdateCommentCtrl.isEdit"
                    ng-click="modalUpdateCommentCtrl.ok()" data-translate="Submit"></button>
        </div>
    </div>
</div>
