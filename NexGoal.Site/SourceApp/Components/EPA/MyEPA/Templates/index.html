<div class="my-epa" ng-controller="IndexEmployeeController as empEPACtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="ManageMyEPA"></li>
            </ul>
        </div>
        <div class="col-sm-12">
            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="empEPACtrl.periods" button-label="Name"
                                                      helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                        <div class="col-sm-1">
                            <button class="button" data-translate="Search" ng-click="empEPACtrl.query()"></button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-sm-12">
            <table class="row table table-bordered table-striped">
                <thead>
                    <tr>
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="PeriodName"></th>
                        <th data-translate="StartDate"></th>
                        <th data-translate="EndDate"></th>
                        <th data-translate="Score"></th>
                        <th data-translate="Grade"></th>
                        <th data-translate="Detail"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="myEPA in empEPACtrl.myEPAs | orderBy: '-IsAllowedToEdit'">
                        <td class="text-center" ng-bind="$index + 1"></td>
                        <td ng-bind="myEPA.Period.Name"></td>
                        <td class="text-center">{{ myEPA.Process.CurrentProcess.StartDate | customDate }}</td>
                        <td class="text-center">{{ myEPA.Process.CurrentProcess.EndDate | customDate }}</td>
                        <td class="text-center">
                            <span ng-show="myEPA.Period.IsEndPeriod">{{myEPA.FinalScore | integerScore}}</span>
                        </td>
                        <td class="text-center">
                            <span ng-show="myEPA.Period.IsEndPeriod">{{myEPA.Grade}}</span>
                        </td>
                        <td class="text-center col-action" ng-switch="myEPA.IsAllowedToEdit">
                            <a ng-switch-when="true" href=""
                               ng-click="empEPACtrl.viewEPADetail(myEPA)"
                               ng-show="!myEPA.Period.IsEndPeriod">
                                <i class="fa fa-pencil-square-o"></i>
                            </a>
                            <a ng-switch-default href=""
                               ng-click="empEPACtrl.viewEPAResult(myEPA)"
                               ng-show="myEPA.Period.IsEndPeriod">
                                <i class="fa fa-search"></i>
                            </a>
                        </td>
                    </tr>
                    <tr ng-show="empEPACtrl.myEPAs.length == 0">
                        <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
