<div ng-controller="EmployeeEPAInfoController as memberEPAInfoCtrl">
    <div class="col-sm-12 sub-header">
        <ul class="row breadcrumb">
            <li class="current" data-translate="SelfEvaluation"></li>
        </ul>
        <!--<div class="check-auto-save">
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round" ng-click="memberEPAInfoCtrl.setAutoSave()"></span>
            </label>
            <span data-translate="AutomaticallySave"></span>
        </div>-->
    </div>

    <div class="col-sm-12">
        <div class="row epa-form">
            <div class="text-center epa-title">{{"EPATilte" | translate}} ({{memberEPAInfoCtrl.epaInfo.Period.Name}})</div>

            <div class="panel-group">

                <div class="panel panel-default no-border">

                    <div class="panel-heading level-1" data-toggle="collapse" data-target=".performance-review-panel">
                        <h4 class="panel-title">{{"Performance review skills and abilities" | translate}} ({{memberEPAInfoCtrl.epaInfo.Employee.Code}} - {{memberEPAInfoCtrl.epaInfo.Employee.FullName}})</h4>
                        <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                    </div>

                    <div class="panel-collapse collapse in performance-review-panel">
                        <div class="panel-body">
                            <div ng-include src="'/SourceApp/Components/EPA/Templates/ratingInstruction.html'"></div>
                            <div class="rating-note no-border">
                                <strong data-translate="EvaluationProcess"></strong>
                            </div>
                            <div class="evaluation-process-section" ng-include src="'/SourceApp/Components/EPA/Templates/evaluationProcess.html'"></div>
                        </div>
                    </div>

                </div>

                <div class="panel panel-default no-border">

                    <div class="panel-heading level-1" data-toggle="collapse" data-target=".discipline-information-panel">
                        <h4 class="panel-title" data-translate="ApproachToWork"></h4>
                        <i class="fa fa-chevron-down text-right" aria-hidden="true"></i>
                    </div>

                    <div class="panel-collapse collapse in discipline-information-panel">
                        <div class="panel-body" ng-include src="'/SourceApp/Components/EPA/Templates/disciplineInformation.html'">
                        </div>
                    </div>

                </div>

                <div class="panel panel-default no-border">

                    <div class="panel-heading level-1" data-toggle="collapse" data-target=".employee-panel">
                        <h4 class="panel-title" data-translate="ForEmployeeUse"></h4>
                        <i class="fa fa-chevron-down pull-right" aria-hidden="true"></i>
                    </div>

                    <div class="panel-collapse collapse in employee-panel">
                        <div class="panel-body" ng-include src="'/SourceApp/Components/EPA/MyEPA/Templates/forEmployeeUse.html'">
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <div class="navbar navbar-default navbar-fixed-bottom action-section">
            <button class="btn btn-back" ng-click="memberEPAInfoCtrl.cancel()" data-translate="Back"></button>
            <button class="btn button-save" ng-click="memberEPAInfoCtrl.save(memberEPAInfoCtrl.epaInfo)"
                    ng-if="memberEPAInfoCtrl.epaInfo && memberEPAInfoCtrl.epaInfo.IsAllowedToEdit" data-translate="Save"></button>
        </div>
    </div>
</div>
