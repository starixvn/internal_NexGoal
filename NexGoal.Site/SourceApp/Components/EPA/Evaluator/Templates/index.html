<div class="evaluator" ng-controller="EvaluatorController as evaluatorCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="Evaluation"></li>
            </ul>
        </div>
        <div class="col-sm-12">

            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.periods" button-label="Name"
                                                      helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0"
                                                      on-close="evaluatorCtrl.handleOnPeriodClose()">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.groupOptions" button-label="Name"
                                                      helper-elements="all reset filter" item-label="GroupName" tick-property="ticked" group-property="msGroup" max-labels="0"
                                                      on-close="evaluatorCtrl.handleOnGroupClose()">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Employee"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.members" button-label="EmployeeId"
                                                      helper-elements="all reset filter" item-label="NickName" tick-property="ticked" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>
                    
                    <div class="col">
                        <button class="button" ng-click="evaluatorCtrl.query()" data-translate="Submit"></button>
                    </div>
                </div>
            </form>

            <table class="row table table-bordered table-striped">
                <thead>
                    <tr>
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="NickName"></th>
                        <th data-translate="FullName"></th>
                        <th data-translate="Team"></th>
                        <th data-translate="JobTitle"></th>
                        <th data-translate="PeriodName"></th>
                        <th data-translate="SelfScore"></th>
                        <th data-translate="Detail" class="col-action"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="memberEPA in evaluatorCtrl.memberEPAs">
                        <td class="text-center" ng-bind="$index + 1"></td>
                        <td>
                            <span ng-bind="memberEPA.Employee.NickName" popover-avatar avatar-src="{{memberEPA.Employee.Avatar}}"></span>
                        </td>
                        <td ng-bind="memberEPA.Employee.FullName"></td>
                        <td ng-bind="memberEPA.Employee.GroupName">
                        </td>
                        <td ng-bind="memberEPA.Employee.JobTitleName"></td>
                        <td ng-bind="memberEPA.Period.Name"></td>
                        <td class="text-center" ng-switch="memberEPA.Process.Self.IsEndProcess">
                            <div ng-switch-when="true" ng-switch="memberEPA.HasMonthlyEPA">
                                <span ng-switch-when="true">
                                    {{memberEPA.MonthlyEPA.AverageSelfScoreConverted | customScore}} / {{memberEPA.Process.Self.MaxTotalScore | customScore}}
                                </span>
                                <span ng-switch-default>
                                    {{memberEPA.Process.Self.TotalScore | customScore}} / {{memberEPA.Process.Self.MaxTotalScore | customScore}}
                                </span>
                            </div>
                            <div ng-switch-default data-translate="Pending"></div>
                        </td>
                        <td class="text-center text-uppercase col-action" ng-switch="memberEPA.IsAllowedToEdit">
                            <a ng-switch-when="true" class="glyphicon glyphicon-edit icon-edit"
                               ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                               ng-attr-title='{{"EvaluateNow" | translate}}'></a>
                            <a ng-switch-default class="glyphicon icon-view"
                               ng-click="evaluatorCtrl.viewEPAResult(memberEPA)"
                               ng-attr-title='{{"ViewEPAResult" | translate}}'></a>
                        </td>
                    </tr>
                    <tr ng-show="evaluatorCtrl.memberEPAs.length == 0">
                        <td class="empty-result" colspan="14" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>
