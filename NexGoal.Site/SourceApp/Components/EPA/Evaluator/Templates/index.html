<div class="evaluator" ng-controller="IndexEvaluatorController as evaluatorCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="Evaluation"></li>
            </ul>
        </div>
        <div class="col-sm-12">

            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.periods" button-label="Name"
                                                      helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0"
                                                      on-close="evaluatorCtrl.handleOnPeriodClose()">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.groupOptions" button-label="Name"
                                                      helper-elements="all none filter" item-label="GroupName" tick-property="ticked" group-property="msGroup" max-labels="0"
                                                      on-close="evaluatorCtrl.handleOnGroupClose()">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Employee"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="evaluatorCtrl.members" button-label="EmployeeId"
                                                      helper-elements="all none filter" item-label="NickName" tick-property="ticked" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <button class="button" ng-click="evaluatorCtrl.query()" data-translate="Search"></button>
                    </div>
                </div>
            </form>

            <table class="row table table-bordered table-striped">
                <thead>
                    <tr>
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="NickName"></th>
                        <th data-translate="FullName"></th>
                        <th data-translate="Team"></th>
                        <th data-translate="JobTitle"></th>
                        <th data-translate="PeriodName"></th>
                        <th data-translate="SelfScore"></th>
                        <th data-translate="EvaluatorScore"></th>
                        <th data-translate="Status"></th>
                        <th data-translate="Detail" class="col-action"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="memberEPA in evaluatorCtrl.memberEPAs | orderBy: '-IsAllowedToEdit'">
                        <td class="text-center" ng-bind="$index + 1"></td>
                        <td>
                            <span ng-bind="memberEPA.Employee.NickName" popover-avatar avatar-src="{{memberEPA.Employee.Avatar}}"></span>
                        </td>
                        <td ng-bind="memberEPA.Employee.FullName"></td>
                        <td ng-bind="memberEPA.Employee.GroupName"></td>
                        <td ng-bind="memberEPA.Employee.JobTitleName"></td>
                        <td ng-bind="memberEPA.Period.Name"></td>
                        <td class="text-center">
                            <span ng-if="memberEPA.Process.Self.IsEndProcess">
                                <span ng-if="memberEPA.Process.Self.TotalScore">{{memberEPA.Process.Self.TotalScore | integerScore}} / {{memberEPA.Process.Self.MaxTotalScore | customScore}}</span>
                                <span ng-if="!memberEPA.Process.Self.TotalScore" data-translate="Dash"></span>
                            </span>
                            <span ng-if="!memberEPA.Process.Self.IsEndProcess" data-translate="Pending"></span>
                        </td>
                        <td class="text-center">
                            <span ng-if="memberEPA.Process.CurrentProcess.TotalScore">{{memberEPA.Process.CurrentProcess.TotalScore | integerScore}} / {{memberEPA.Process.CurrentProcess.MaxTotalScore | customScore}}</span>
                            <span ng-if="!memberEPA.Process.CurrentProcess.TotalScore" data-translate="Dash"></span>
                        </td>
                        <td class="text-center">
                            <div ng-if="memberEPA.Process.CurrentProcess.Evaluated" class="glyphicon glyphicon-ok"></div>
                        </td>
                        <td class="text-center text-uppercase col-action" ng-switch="memberEPA.IsAllowedToEdit">
                            <a ng-switch-when="true"
                               ng-click="evaluatorCtrl.viewEPADetail(memberEPA)"
                               ng-attr-title='{{"EvaluateNow" | translate}}'
                               ng-if="!memberEPA.Period.IsEndPeriod">
                                <i class="fa fa-pencil-square-o"></i>
                            </a>
                            <a ng-switch-default
                               ng-click="evaluatorCtrl.viewEPAResult(memberEPA)"
                               ng-attr-title='{{"ViewEPAResult" | translate}}'
                               ng-if="memberEPA.Period.IsEndPeriod">
                                <i class="fa fa-search"></i>
                            </a>
                        </td>
                    </tr>
                    <tr ng-if="evaluatorCtrl.memberEPAs.length == 0">
                        <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>
