<div class="panel-body" ng-include src="'/SourceApp/Components/EPA/Templates/employeeEfficiencyInfo.html'">
</div>

<div class="level-2" data-toggle="collapse" data-target=".quality-of-work-table">B. {{"QualityOfWork" | translate}}</div>

<div class="collapse in quality-of-work-table">

    <table class="table table-bordered" ng-include src="'/SourceApp/Components/EPA/Evaluator/Templates/listKPI.html'"></table>

    <table class="table table-bordered table-total pa-form">
        <tbody>
            <tr class="performance-grade">
                <td data-translate="PerformanceGradingScale"></td>
                <td ng-repeat="score in memberEPAInfoCtrl.standardGrades">
                    {{score.Code}}. {{score.Name}}: {{score.LeftScore}} ~ {{score.RightScore}}
                </td>
            </tr>
            <tr class="level-2">
                <td colspan="6" data-translate="EmployeeComment"></td>
            </tr>
            <tr class="comment">
                <td colspan="6" class="textarea-comment">
                    <textarea class="form-control" readonly="readonly"
                              ng-if="memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess"
                              ng-model="memberEPAInfoCtrl.epaInfo.Process.Self.Comment"></textarea>
                    <textarea class="form-control" readonly="readonly"
                              ng-if="!memberEPAInfoCtrl.epaInfo.Process.Self.IsEndProcess">
                        Pending
                    </textarea>
                </td>
            </tr>
            <tr class="level-2">
                <td colspan="6" data-translate="EvaluatorComment"></td>
            </tr>
            <tr class="comment">
                <td colspan="6" class="textarea-comment">
                    <p ng-if="memberEPAInfoCtrl.epaInfo.Process.CurrentProcess.IsMissingComment" data-translate="RequiredComment" class="note"></p>
                    <p>
                        <span data-translate="Comments" class="lable-comment-if-any"></span>&nbsp;
                        <span class="label-word-countdown" data-translate="LimitedWords"></span>
                        <span class="note" data-translate="(*)"></span>
                    </p>
                    <textarea class="form-control" maxlength="2000"
                              ng-model="memberEPAInfoCtrl.epaInfo.Process.CurrentProcess.Comment"
                              ng-readonly="!memberEPAInfoCtrl.epaInfo.IsAllowedToEdit"></textarea>
                </td>
            </tr>
        </tbody>
    </table>

</div>
