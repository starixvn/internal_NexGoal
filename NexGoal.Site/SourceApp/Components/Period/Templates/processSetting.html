<div ng-controller="ProcessSettingPeriodController as processSettingPeriodCtrl">
    <table class="row table table-bordered table-striped period-process-setting">
        <thead>
            <tr class="headerName">
                <th class="width-200" data-translate="SymbolCount">
                </th>
                <th class="width-200 text-center" data-translate="HumanResource">
                </th>
                <th class="width-200 text-center" data-translate="SelfEvaluator">
                </th>
                <th class="width-200 text-center" data-translate="Evaluator">
                </th>
                <th class="width-200 text-center" data-translate="Reviewer">
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-translate="Duration"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <select ng-model="process.Duration" ng-options="opt for opt in [] | range:30"></select>
                </td>
            </tr>
            <tr>
                <td data-translate="NoticeAtBegin"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <input type="checkbox" ng-model="process.HasSendMail" />
                </td>
            </tr>
            <tr>
                <td data-translate="RemindDay"></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.processSettings">
                    <select ng-model="process.RemindDay"
                            ng-options="opt for opt in processSettingPeriodCtrl.remindDay"></select>
                </td>
            </tr>
            <tr>
                <td data-translate="FocusDay"></td>
                <td></td>
                <td></td>
                <td class="text-center" ng-repeat="process in processSettingPeriodCtrl.paProcessSettings">
                    <select ng-model="process.Duration"
                            ng-options="opt for opt in processSettingPeriodCtrl.remindDay"></select>
                </td>
                <td ng-show="processSettingPeriodCtrl.paProcessSettings.length === 0"></td>
                <td ng-show="processSettingPeriodCtrl.paProcessSettings.length === 0"></td>
            </tr>
        </tbody>
    </table>

    <br />

    <div class="btn-box btn-process-save">
        <input type="button" value="Save" class="button" ng-click="processSettingPeriodCtrl.save()" />
    </div>
</div>
