<div ng-controller="UpdatePeriodController as updateCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb period-breadcrumb">
                <li class="current" data-translate="UpdateEvaluationPeriod"></li>
            </ul>
            <div class="button-block">
                <a class="button btn-cancel" ng-click="updateCtrl.backToList()">
                    <i class="fa fa-angle-left icon-back"></i> {{"BackToList" | translate}}
                </a>
            </div>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset id="PeriodTab">
                <tab heading="BASIC INFORMATION" class="tab-cursor" active="updateCtrl.dataTab.basicInformation" select="updateCtrl.tabBasicSelect()">
                    <div ng-include src="'/SourceApp/Components/Period/Templates/basicInformation.html'"></div>
                </tab>
                <tab heading="PROCESS SETTING" class="tab-cursor" active="updateCtrl.dataTab.processSetting" select="updateCtrl.tabProcessSettingSelect()">
                    <div ng-include src="'/SourceApp/Components/Period/Templates/processSetting.html'"></div>
                </tab>
                <tab heading="EMPLOYEE SETTING" class="tab-cursor" active="updateCtrl.dataTab.employeeSetting" select="updateCtrl.tabEmployeeSettingSelect()">
                    <div ng-include src="'/SourceApp/Components/Period/Templates/employeeSetting.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
