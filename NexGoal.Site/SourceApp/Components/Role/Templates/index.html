<div ng-controller="RoleController as roleCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="RoleManagement"></li>
            </ul>
        </div>
        <div class="col-sm-12 role-filter-width">
            <form class="form-inline form-common filter " role="form">
                <div class="form-group">
                    <div class="col">
                        <label data-translate="Role" class="control-label"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="roleCtrl.filter.roleId"
                                    ng-options="opt.RoleId as opt.RoleCode for opt in roleCtrl.systemRoleOptions"
                                    ng-change="roleCtrl.query()"></select>
                        </div>
                    </div>

                    <div class="col">
                        <button class="button" get-role-permission ng-show="!roleCtrl.isSystemAdmin" data-translate="Save"></button>
                    </div>
                </div>                
            </form>

            <form class="authority-table clearfix" novalidate>
                <table name="tableFunction" class="table table-bordered">
                    <thead>
                        <tr>
                            <th class="text-center" data-translate="Function" rowspan="2">
                            </th>
                            <th class="text-center" data-translate="RolePermission" colspan="2">
                            </th>
                        </tr>
                        <tr>
                            <th class="text-center" data-translate="Read">
                            </th>
                            <th class="text-center" data-translate="Host">
                            </th>
                        </tr>
                    </thead>
                    <tr ng-repeat="data in roleCtrl.roleFunctions">
                        <td ng-include src="'/SourceApp/Components/Role/Templates/treeItem.html'"></td>
                        <td class="text-center" ng-include src="'/SourceApp/Components/Role/Templates/treeReadCheckbox.html'"></td>
                        <td class="text-center" ng-include src="'/SourceApp/Components/Role/Templates/treeHostCheckbox.html'"></td>
                    </tr>
                </table>
            </form>
        </div>               

    </div>
</div>
