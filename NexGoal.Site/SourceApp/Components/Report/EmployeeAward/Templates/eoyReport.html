<div ng-controller="EOYReportController as eoyReportCtrl">
    <form novalidate class="form-inline filter">
        <div class="form-group">
            <div class="col">
                <label class="control-label" data-translate="Period"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="eoyReportCtrl.filter.eoqyId"
                            ng-options="item.EOQYId as item.Year for item in eoyReportCtrl.periods"></select>
                </div>
            </div>
            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="eoyReportCtrl.teams" button-label="Name"
                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>
            <div class="col">
                <label class="control-label" data-translate="Employee"></label>
                <div class="control-content">
                    <input class="form-control" placeholder="Enter full name or nick name"
                           ng-model="eoyReportCtrl.filter.query" />
                </div>
            </div>
            <div class="col">
                <label class="control-label" data-translate="Status"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="eoyReportCtrl.filter.statusId">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option class="nomination-status nominated" value="1" data-translate="Nominated"></option>
                        <option class="nomination-status shortlisted" value="2" data-translate="Shortlisted"></option>
                        <option class="nomination-status winner" value="3" data-translate="Winner"></option>
                    </select>
                </div>
            </div>
            <div class="col button-block">
                <button class="button" ng-click="eoyReportCtrl.query()" data-translate="Search"></button>
            </div>
        </div>
    </form>

    <table class="table table-bordered table-striped">
        <thead>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="Nominee"></th>
                <th data-translate="Team"></th>
                <th data-translate="Status"></th>
                <th data-translate="Nominator"></th>
                <th data-translate="Action"></th>
            </tr>
        </thead>
        <tbody ng-if="eoyReportCtrl.nominationReports.length === 0">
            <tr>
                <td colspan="6" class="empty-result" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tbody ng-if="eoyReportCtrl.nominationReports.length > 0" ng-repeat="item in eoyReportCtrl.nominationReports"
               ng-init="rowIndex=$index">
            <tr ng-repeat="nomination in item.Nominations">
                <td rowspan="{{item.NumberOfNominators}}" class="text-center" ng-if="$first">
                    {{rowIndex + 1}}
                </td>
                <td rowspan="{{item.NumberOfNominators}}" ng-if="$first">
                    {{item.Nominee.FullName}} ({{item.Nominee.NickName}})
                    <span ng-if="item.Nominations.length > 1"> - ({{item.Nominations.length}} votes)</span>
                </td>
                <td rowspan="{{item.NumberOfNominators}}" ng-if="$first">{{item.Nominee.Group.GroupName}}</td>
                <td class="text-center" rowspan="{{item.NumberOfNominators}}" ng-if="$first">
                    <span class="nomination-status"
                          ng-class="{'nominated': item.StatusId === 1, 'shortlisted': item.StatusId === 2, 'winner': item.StatusId === 3}">
                        {{item.StatusToString}}
                    </span>
                </td>
                <td>{{nomination.Nominator.FullName}} ({{nomination.Nominator.NickName}})</td>
                <td class="text-center">
                    <a class="fa fa-search" title="View Detail"
                       ng-click="eoyReportCtrl.viewNomination(nomination)"></a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
