<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span>{{modalMasterReportCommentCtrl.modalTitle}}</span>
            <span class="close-popup" ng-click="modalMasterReportCommentCtrl.close()"></span>
        </div>
    </div>
    <div class="modal-body">
        {{modalMasterReportCommentCtrl.comment}}
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel customize" ng-click="modalMasterReportCommentCtrl.close()" data-translate="Cancel"></button>
    </div>
</div>
