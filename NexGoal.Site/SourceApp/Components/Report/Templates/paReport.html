<div ng-controller="PAReportController as paReportCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current">PA Report</li>
            </ul>
        </div>

        <div class="col-sm-12">
            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="paReportCtrl.periods" button-label="Name"
                                                      helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="paReportCtrl.teams" button-label="Name"
                                                      helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Employee"></label>
                        <div class="control-content">
                            <input class="form-control employe-search" placeholder="-- Search an employee --" search-auto-complete
                                   ng-model="paReportCtrl.searchEmployee"
                                   search-employees="paReportCtrl.getEmployee()"
                                   ng-change="paReportCtrl.unselectEmployee()"
                                   employee="paReportCtrl.filter.employee" />
                        </div>
                    </div>

                    <div class="col button-block">
                        <button class="button" data-translate="Search" ng-click="paReportCtrl.query()"></button>
                        <button class="button btnExcel" export-pa
                                ng-click="paReportCtrl.exportExcel()">
                            Excel
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="col-sm-12">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr class="header-table">
                        <th colspan="13">
                            <input type="text" class="search-inline-textbox search pull-right"
                                   ng-model="paReportCtrl.searchKey"
                                   ng-change="paReportCtrl.search()" />
                        </th>
                    </tr>
                    <tr>
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="NickName"></th>
                        <th data-translate="FullName"></th>
                        <th data-translate="JobTitle"></th>
                        <th data-translate="Team"></th>
                        <th data-translate="EvaluationPeriod"></th>
                        <th data-translate="PeriodType"></th>
                        <th data-translate="SelfScore"></th>
                        <th data-translate="EvaluatorScore"></th>
                        <th data-translate="ReviewerScore"></th>
                        <th data-translate="PAFinalScore"></th>
                        <th data-translate="Grade"></th>
                        <th data-translate="Action"></th>                        
                    </tr>
                </thead>
                <tbody>
                    <tr dir-paginate="pa in paReportCtrl.filteredItems | itemsPerPage: paReportCtrl.pageSize | orderBy:'-Employee.NickName':true"
                        current-page="paReportCtrl.currentPage">
                        <td class="text-center" ng-bind="paReportCtrl.getIndex($index, paReportCtrl.currentPage, paReportCtrl.pageSize)"></td>
                        <td ng-bind="pa.Employee.NickName"></td>
                        <td ng-bind="pa.Employee.FullName"></td>
                        <td ng-bind="pa.Employee.JobTitleName"></td>
                        <td ng-bind="pa.Employee.GroupName"></td>
                        <td ng-bind="pa.Period.Name"></td>
                        <td ng-bind="pa.Period.TargetTypeName"></td>
                        <td class="text-center">
                            <span ng-if="!pa.Process.Self.IsEndProcess" data-translate="Pending"></span>
                            <span ng-if="pa.Process.Self.IsEndProcess && !pa.Process.Self.TotalScore" data-translate="Dash"></span>
                            <span ng-if="pa.Process.Self.IsEndProcess && pa.Process.Self.TotalScore">{{pa.Process.Self.TotalScore | integerScore}}</span>
                        </td>
                        <td class="text-center">
                            <span ng-if="!pa.Process.Evaluators[0].IsEndProcess" data-translate="Pending"></span>
                            <span ng-if="pa.Process.Evaluators[0].IsEndProcess && !pa.Process.AverageScoreByEvaluators" data-translate="Dash"></span>
                            <span ng-if="pa.Process.Evaluators[0].IsEndProcess && pa.Process.AverageScoreByEvaluators">{{pa.Process.AverageScoreByEvaluators| integerScore}}</span>
                        </td>
                        <td class="text-center">
                            <span ng-if="!pa.Process.Reviewers[0].IsEndProcess" data-translate="Pending"></span>
                            <span ng-if="pa.Process.Reviewers[0].IsEndProcess && !pa.Process.AverageScoreByReviewers" data-translate="Dash"></span>
                            <span ng-if="pa.Process.Reviewers[0].IsEndProcess && pa.Process.AverageScoreByReviewers">{{pa.Process.AverageScoreByReviewers| integerScore}}</span>
                        </td>
                        <td class="text-center">
                            <span ng-if="!pa.Period.IsEndPeriod" data-translate="Pending"></span>
                            <span ng-if="pa.Period.IsEndPeriod && pa.FinalScore==0" data-translate="Dash"></span>
                            <span ng-if="pa.Period.IsEndPeriod && pa.FinalScore && pa.FinalScore!=0">{{pa.FinalScore| integerScore}}</span>
                        </td>
                        <td class="text-center">
                            <span ng-if="!pa.Period.IsEndPeriod" data-translate="Pending"></span>
                            <span ng-if="pa.Period.IsEndPeriod && !pa.Grade" data-translate="Dash"></span>
                            <span ng-if="pa.Period.IsEndPeriod && pa.Grade">{{pa.Grade}}</span>
                        </td>
                        <td class="text-center">                            
                            <span ng-if="pa.Period.IsEndPeriod">
                                <a title="View Detail"
                                   ng-click="paReportCtrl.viewEPADetail(pa.EPAId)">
                                    <i class="fa fa-search"></i>
                                </a> | 
                                <a title="Export PDF"
                                   ng-click="paReportCtrl.exportPDF(pa.EPAId)">
                                    <i class="icon-pdf"></i>
                                </a>
                            </span>
                        </td>
                    </tr>
                    <tr ng-if="paReportCtrl.filteredItems.length == 0">
                        <td class="empty-result" colspan="13" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
                <tfoot ng-if="paReportCtrl.filteredItems.length > 0">
                    <tr>
                        <td colspan="13" class="paging">
                            <span data-translate="Show"></span>
                            <select class="dropdown-entry" ng-model="paReportCtrl.pageSize"
                                    ng-options="entry for entry in paReportCtrl.entries"></select>
                            <span data-translate="entries"></span>
                            <div class="pull-right custom-paging">
                                <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                            </div>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
