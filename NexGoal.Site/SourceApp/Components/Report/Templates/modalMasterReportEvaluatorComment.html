<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span>{{modalMasterReportEvaluatorCommentCtrl.modalTitle}}</span>
            <span class="close-popup" ng-click="modalMasterReportEvaluatorCommentCtrl.close()"></span>
        </div>
    </div>
    <div class="modal-body modal-view-comment">
        <div ng-repeat="evaluator in modalMasterReportEvaluatorCommentCtrl.evaluatorComments">
            <div>
                <p>{{"Evaluator" | translate}}: <b>{{evaluator.EvaluatorFullName}} ({{evaluator.EvaluatorNickName}})</b></p>
                <div class="comment" ng-bind="evaluator.Comment"></div>
                <br />
            </div>
        </div>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="modalMasterReportEvaluatorCommentCtrl.close()" data-translate="Close"></button>
    </div>
</div>
