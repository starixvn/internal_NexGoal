<div class="epa-summary-report" ng-controller="EPASummaryReportController as epaSummaryReportCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="EPASummaryReport"></li>
            </ul>
        </div>
        <div class="col-sm-12">
            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="epaSummaryReportCtrl.periods" button-label="Name"
                                                      helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label size-l" data-translate="DepartmentTeam"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="epaSummaryReportCtrl.filter.departmentId"
                                    ng-options="opt.DepartmentId as opt.Name for opt in epaSummaryReportCtrl.treeDepartment">
                                <option value="">-- {{"All" | translate}} --</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <label class="control-label" data-translate="Category"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="epaSummaryReportCtrl.filter.isLocal">
                                <option value="">-- {{"All" | translate}} --</option>
                                <option value="false">{{"Expat" | translate}}</option>
                                <option value="true">{{"Local" | translate}}</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <button class="button" ng-click="epaSummaryReportCtrl.query(epaSummaryReportCtrl.filter)" data-translate="Search"></button>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-sm-12">
            <div class="freegrid" data-export-epa-summary-report data-grid-epa-summary-report
                 data-grid-data="epaSummaryReportCtrl.epaSummary" data-grid-expand-height="300"
                 data-on-page-changing="epaSummaryReportCtrl.pageChanging"
                 data-on-sort-changing="epaSummaryReportCtrl.sortChanging"
                 data-sort-column-name="epaSummaryReportCtrl.filter.sortColumnName"
                 data-sort-direction="epaSummaryReportCtrl.filter.sortDirection"
                 data-export-report="epaSummaryReportCtrl.exportReport"
                 data-page-option="epaSummaryReportCtrl.filter"></div>
        </div>
    </div>
</div>
