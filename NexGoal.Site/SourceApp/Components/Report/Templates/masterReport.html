<div ng-controller="MasterReportController as masterReportCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current">Master Report</li>
            </ul>
        </div>
        
        <div class="col-sm-12">
            <form novalidate class="filter form-inline" role="form">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="masterReportCtrl.filter.periodId"
                                    ng-options="opt.PeriodId as opt.Name for opt in masterReportCtrl.periods">
                            </select>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="masterReportCtrl.teams" button-label="Name"
                                                      helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Employee"></label>
                        <div class="control-content">
                            <input class="form-control employe-search" placeholder="Enter full name or nick name" search-auto-complete
                                   ng-model="masterReportCtrl.searchEmployee"
                                   search-employees="masterReportCtrl.getEmployee()"
                                   ng-change="masterReportCtrl.unselectEmployee()"
                                   employee="masterReportCtrl.employee" />
                        </div>
                    </div>

                    <div class="col">
                        <button class="button" data-translate="Search"></button>
                    </div>
                </div>
            </form>
        </div>

        <div class="col-sm-12">
            <div class="freegrid" data-grid-master-report>
            </div>
        </div>
    </div>
</div>
