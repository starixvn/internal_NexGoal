<div ng-controller="DashboardController as dashboardCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="MyDashboard"></li>
            </ul>
        </div>

        <div class="col-sm-12">
            <div class="panel-group dashboard">
                <div class="panel panel-default no-border">
                    <!--ng-if="dashboardCtrl.toDoList.EPAInfos.length > 0 || dashboardCtrl.toDoList.Nominations.length > 0 || dashboardCtrl.toDoList.PAFocuses.length > 0">-->
                    <div class="panel-heading level-1" data-toggle="collapse" data-target=".todolist">
                        <h4 class="panel-title" data-translate="ToDoList"></h4>
                    </div>

                    <div class="panel-collapse collapse in todolist" ng-include src="'/SourceApp/Components/Dashboard/Templates/todolist.html'"></div>
                </div>

                <div ng-include src="'/SourceApp/Components/Dashboard/Templates/evaluationProcess.html'"></div>

                <div class="panel panel-default no-border" ng-if="dashboardCtrl.selfEvaluatorPermission != dashboardCtrl.policy.None">
                    <div class="panel-heading level-1" data-toggle="collapse" data-target=".my-epa">
                        <h4 class="panel-title" data-translate="MyEPA"></h4>
                    </div>

                    <div class="panel-collapse collapse in my-epa">
                        <div class="panel-body" ng-include src="'/SourceApp/Components/Dashboard/Templates/myEPA.html'">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
