<table class="table table-bordered">
    <thead>
        <tr>
            <th>#</th>
            <th>Period Name</th>
            <th>Evaluation Type</th>
            <th>Month</th>
            <th>Year</th>
            <th>Start</th>
            <th>End</th>
            <th>Score</th>
            <th>Grade</th>
            <th>View Detail</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="myEPA in dashboardCtrl.myEPAs">
            <td class="text-center" ng-bind="::$index + 1"></td>
            <td ng-bind="::myEPA.Period.Name"></td>
            <td class="text-center" ng-bind="::myEPA.Period.TargetTypeName">
            </td>
            <td class="text-center">
                Month goes here
            </td>
            <td class="text-center">
                Month goes here
            </td>
            <td class="text-center" ng-bind="::myEPA.Period.StartDate | date : 'dd MMM, yyyy'"></td>
            <td class="text-center" ng-bind="::myEPA.Period.EndDate | date : 'dd MMM, yyyy'"></td>
            <td class="text-center">
                Score goes here
            </td>
            <td class="text-center">
                Grade goes here
            <td class="text-center col-action">
                <a ng-click="dashboardCtrl.viewEPADetail(myEPA)" href="javascript:;"
                   ng-if="myEPA.EPAId > 0 && (myEPA.IsAllowedToEdit || !myEPA.IsEndProcessBySelf)"
                   ng-attr-title='{{"EvaluateNow" | translate}}'>
                    <i class="fa fa-pencil-square-o "></i>
                </a>
                <a ng-click="dashboardCtrl.viewEPAResult(myEPA)" href="javascript:;"
                   ng-if="myEPA.EPAId > 0 && !(myEPA.IsAllowedToEdit || !myEPA.IsEndProcessBySelf)"
                   ng-attr-title='{{"ViewEPAResult" | translate}}'>
                    <i class="fa fa-search"></i>
                </a>
            </td>
        </tr>
    </tbody>
    <tbody ng-show="dashboardCtrl.myEPAs.length == 0">
        <tr>
            <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
        </tr>
    </tbody>
</table>
