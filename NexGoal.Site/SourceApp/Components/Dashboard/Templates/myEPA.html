<table class="table table-bordered pa-form">
    <thead>
        <tr>
            <th>#</th>
            <th>Period Name</th>
            <th>Evaluation Type</th>
            <th>Start</th>
            <th>End</th>
            <th colspan="2" title="Click to show/hide score." class="col-score" ng-click="dashboardCtrl.showHideScore()"><u>Score & Grade</u></th>
            <th>View Detail</th>
        </tr>
    </thead>
    <tbody ng-if="dashboardCtrl.myEPAs.length > 0">
        <tr ng-repeat="myEPA in dashboardCtrl.myEPAs">
            <td class="text-center" ng-bind="::$index + 1"></td>
            <td ng-bind="::myEPA.Period.Name"></td>
            <td ng-bind="::myEPA.Period.TargetTypeName"></td>
            <td class="text-center" ng-bind="::myEPA.Period.StartDate | date : 'dd MMM, yyyy'"></td>
            <td class="text-center" ng-bind="::myEPA.Period.EndDate | date : 'dd MMM, yyyy'"></td>
            <td class="text-center">
                <span ng-if="dashboardCtrl.showScore" ng-bind="::myEPA.FinalScore | integerScore"></span>
            </td>
            <td class="text-center">
                <span ng-if="dashboardCtrl.showScore" ng-bind="::myEPA.Grade"></span>
            <td class="text-center col-action">
                <a ng-click="dashboardCtrl.viewEPADetail(myEPA)" href=""
                   ng-if="myEPA.EPAId > 0 && (myEPA.IsAllowedToEdit || !myEPA.IsEndProcessBySelf)"
                   ng-attr-title='{{"EvaluateNow" | translate}}'>
                    <i class="fa fa-pencil-square-o "></i>
                </a>
                <a ng-click="dashboardCtrl.viewEPAResult(myEPA)" href=""
                   ng-if="myEPA.EPAId > 0 && myEPA.Period.IsEndPeriod"
                   ng-attr-title='{{"ViewEPAResult" | translate}}'>
                    <i class="fa fa-search"></i>
                </a>
            </td>
        </tr>
    </tbody>
    <tbody ng-if="dashboardCtrl.myEPAs.length == 0">
        <tr>
            <td class="empty-result" colspan="10" data-translate="EmptyResult"></td>
        </tr>
    </tbody>
</table>
