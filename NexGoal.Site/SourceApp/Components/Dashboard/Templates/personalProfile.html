<div class="panel-body">


    <div class="img-user">
        <img class="img-default" ng-src="{{dashboardCtrl.employee.Avatar}}" alt="User" />
    </div>


    <div class="col-sm-10 info-user">
        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Employee Code</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.Code"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Nick Name</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.NickName"></strong>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Full Name</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.FullName"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Job Title</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.JobTitle.JobTitleName"></strong>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Department</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.Department.Name"></strong>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Team</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.Group.GroupName"></strong>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="col-sm-6">
                <div class="col-sm-4 col-lg-4"><strong>Joined Date</strong></div>
                <div class="col-sm-8 col-lg-8">
                    <strong ng-bind="dashboardCtrl.employee.JoinedDate | customDate"></strong>
                </div>
            </div>
        </div>

    </div>

</div>
