<div class="panel-body">


    <div class="img-user">
        <img class="img-default" ng-src="{{dashboardCtrl.employee.Avatar}}" alt="User" />
    </div>


    <div class="info-user">
        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong>Employee Code</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Code"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong>Nick Name</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.NickName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong>Full Name</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.FullName"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong>Job Title</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.JobTitle.JobTitleName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong>Department</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Department.Name"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong>Team</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Group.GroupName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong>Joined Date</strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.JoinedDate | customDate"></span>
                </div>
            </div>
        </div>

    </div>

</div>
