<div class="panel-body">
    <div class="img-user">
        <img class="img-default" ng-src="http:{{dashboardCtrl.employee.Avatar}}" alt="User" />
    </div>

    <div class="info-user">

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong data-translate="EmployeeCode"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Code"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong data-translate="NickName"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.NickName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong data-translate="FullName"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.FullName"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong data-translate="JobTitle"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.JobTitle.JobTitleName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong data-translate="Department"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Department.Name"></span>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label"><strong data-translate="Team"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.Group.GroupName"></span>
                </div>
            </div>
        </div>

        <div class="row row-item line">
            <div class="info-item">
                <div class="info-label"><strong data-translate="Joined Date"></strong></div>
                <div class="info-detail">
                    <span ng-bind="dashboardCtrl.employee.JoinedDate | customDate"></span>
                </div>
            </div>
        </div>

    </div>

</div>
