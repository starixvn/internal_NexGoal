<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="UpdateDisciplineRecord"></span>
            <span class="close-popup" ng-click="updateViolationCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">

            <div class="form-group">
                <label class="col-sm-3 control-label" data-translate="Employee"></label>
                <div class="col-sm-6 field">
                    <input type="text" class="form-control"
                           ng-disabled="true" 
                           ng-model="updateViolationCtrl.violation.EmployeeFullName" />
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label required-label" data-translate="IssueDate"></label>
                <div class="col-sm-4 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="updateViolationCtrl.violation.RawEffectedDate"
                           ng-click="updateViolationCtrl.openPopupEffectedDate($event)"
                           is-open="updateViolationCtrl.calendar.EffectedDateOpened" />
                    <calendar-image class="calendar-image" ng-click="updateViolationCtrl.openPopupEffectedDate($event)"></calendar-image>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label required-label" data-translate="Content"></label>
                <div class="col-sm-9 field">
                    <textarea class="form-control none-resize" rows="10" maxlength="2000"
                              ng-model="updateViolationCtrl.violation.Description"></textarea>
                </div>
            </div>

        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel customize" ng-click="updateViolationCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="updateViolationCtrl.submit()" data-translate="Submit"></button>
    </div>
</div>
