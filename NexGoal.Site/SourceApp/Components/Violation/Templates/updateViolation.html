<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="CreateViolation"></span>
            <span class="close-popup" ng-click="updateViolationCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">

            <div class="form-group">
                <label class="col-sm-3 control-label" data-translate="Employee"></label>
                <div class="col-sm-5 field">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label required-label">Effective Date</label>
                <div class="col-sm-4 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="updateViolationCtrl.violation.RawEffectiveDate"
                           ng-click="updateViolationCtrl.openPopupEffectiveDate($event)"
                           is-open="updateViolationCtrl.calendar.EffectiveDateOpened" />
                    <calendar-image class="calendar-image" ng-click="updateViolationCtrl.openPopupEffectiveDate($event)"></calendar-image>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label required-label">Warning Content</label>
                <div class="col-sm-9 field">
                    <textarea class="form-control none-resize" rows="3"
                              ng-model="updateViolationCtrl.violation.WarningContent"></textarea>
                </div>
            </div>

        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel customize" ng-click="updateViolationCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="updateViolationCtrl.submit()" data-translate="Submit"></button>
    </div>
</div>
