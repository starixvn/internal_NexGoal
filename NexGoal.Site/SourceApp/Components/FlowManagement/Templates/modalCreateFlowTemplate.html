<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="CreateFlowTemplate"></span>
            <span class="close-popup" ng-click="createFlowTemplateCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" novalidate>
            <div class="form-group required">
                <label class="col-sm-3 control-label" data-translate="Name"></label>
                <div class="col-sm-9">
                    <input type="text" class="form-control" ng-model="createFlowTemplateCtrl.flowTemplate.Name" required maxlength="200" />
                </div>
            </div>
            <div class="form-group top-buffer required">
                <label class="col-sm-3 control-label" data-translate="Type"></label>
                <div class="col-sm-9">
                    <select class="form-control" ng-model="createFlowTemplateCtrl.flowTemplate.TargetTypeId"
                            ng-options="opt.TargetTypeId as opt.Name for opt in createFlowTemplateCtrl.targetTypes">
                        <option style="display: none" value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-3 control-label" data-translate="Active"></label>
                <div class="col-sm-9 field active-label">
                    <input type="checkbox" ng-model="createFlowTemplateCtrl.flowTemplate.IsActive" />
                </div>
            </div>
            <div class="form-group top-buffer">
                <label class="col-sm-3 control-label" data-translate="Description"></label>
                <div class="col-sm-9">
                    <textarea class="form-control none-resize" maxlength="500" rows="5"
                              ng-model="createFlowTemplateCtrl.flowTemplate.Description"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="createFlowTemplateCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="createFlowTemplateCtrl.save()" data-translate="Submit"></button>
    </div>
</div>
