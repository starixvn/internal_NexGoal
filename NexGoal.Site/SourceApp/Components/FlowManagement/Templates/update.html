<div ng-controller="UpdateFlowTemplateController as updateCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="EditFlowTemplate"></li>
            </ul>
            <div class="button-block">
                <a class="button btn-cancel" ng-click="updateCtrl.backToList()">
                    <i class="fa fa-angle-left icon-back"></i> {{"BackToList" | translate}}
                </a>     
            </div>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset id="FlowTemplateTab">
                <tab heading="GENERAL INFORMATION" class="tab-cursor">
                    <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/generalInformation.html'"></div>
                </tab>
                <tab heading="TEAM" class="tab-cursor" select="updateCtrl.tabDepartmentSelected()">
                    <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/departmentFlow.html'"></div>
                </tab>
                <tab heading="PERSONAL" class="tab-cursor" select="updateCtrl.tabPersonalSelected()">
                    <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/personalFlow.html'"></div>
                </tab>
                <tab heading="FLOW LIST" class="tab-cursor" select="updateCtrl.tabResultSettingSelected()">
                    <div ng-include src="'/SourceApp/Components/FlowManagement/Templates/resultSetting.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
