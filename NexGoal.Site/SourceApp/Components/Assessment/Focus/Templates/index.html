<div ng-controller="FocusController as focusCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current">{{"ContributionAndRanking" | translate}} ({{"PAFocus" | translate}})</li>
            </ul>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset id="FocusTab">
                <tab class="tab-cursor" active="focusCtrl.dataTab.paFocus" select="focusCtrl.tabPAFocusSelected()">
                    <tab-heading>
                        {{"PAFocus" | translate}}
                        <a href="" ng-click="focusCtrl.openPopupInformation()"><i class="fa fa-info-circle icon-info"></i></a>
                    </tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/Focus/Templates/paFocus.html'"></div>
                </tab>
                <tab class="tab-cursor" active="focusCtrl.dataTab.chart" select="focusCtrl.tabChartSelected()">
                    <tab-heading>
                        {{"Chart" | translate}}
                    </tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/Focus/Templates/chart.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
