<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span ng-show="!paModalCurrentObjectiveCtrl.IsReadOnly" data-translate="ViewObjectives"></span>
            <span ng-show="paModalCurrentObjectiveCtrl.IsReadOnly" data-translate="EditObjectives"></span>
            <span class="close-popup" ng-click="paModalObjectiveCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body modal-update-comment">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-3 control-label text-left">
                    <span data-translate="Objectives"></span>
                </label>
                <div class="col-sm-9 field">
                    <textarea type="text" class="form-control comment"
                              ng-model="paModalObjectiveCtrl.CurrentObjective"
                              ng-readonly="paModalObjectiveCtrl.IsReadOnly"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="paModalCurrentObjectiveCtrl.cancel()">
            <span ng-show="paModalCurrentObjectiveCtrl.IsReadOnly" data-translate="Cancel"></span>
            <span ng-show="!paModalCurrentObjectiveCtrl.IsReadOnly" data-translate="Close"></span>
        </button>
        <button class="button" ng-click="paModalCurrentObjectiveCtrl.ok()" data-translate="Submit" ng-show="!paModalCurrentObjectiveCtrl.IsReadOnly"></button>
    </div>
</div>
