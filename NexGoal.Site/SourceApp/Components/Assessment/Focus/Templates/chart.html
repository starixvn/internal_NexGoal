<div ng-controller="PAFocusChartController as paFocusChartCtrl">
    <form novalidate class="form-inline filter">

        <div class="form-group">

            <div class="col">
                <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="paFocusChartCtrl.filter.periodId"
                            ng-options="item.PeriodId as item.Name group by item.Year for item in paFocusChartCtrl.periods"></select>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="paFocusChartCtrl.teams" button-label="Name"
                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>

            <div class="col button-block">
                <button class="button" data-translate="Submit" ng-click="paFocusChartCtrl.query()"></button>
            </div>

        </div>

    </form>

    <div class="row">
        <div class="text-center empty-result" data-translate="EmptyResult" ng-if="paFocusChartCtrl.isEmptyResult"></div>
        <div class="col-sm-6" ng-repeat="group in paFocusChartCtrl.groups">
            <div id="pie-chart-group-{{group.TeamId}}">{{::paFocusChartCtrl.buildChart(group)}}</div>
        </div>
    </div>
</div>
