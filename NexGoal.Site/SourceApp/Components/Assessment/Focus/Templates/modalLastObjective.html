<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span ng-if="paModalLastObjectiveCtrl.IsReadOnly" data-translate="ViewCurrentObjective"></span>
            <span ng-if="!paModalLastObjectiveCtrl.IsReadOnly" data-translate="EditCurrentObjective"></span>
            <span class="close-popup" ng-click="paModalLastObjectiveCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body"
         ng-class="{'modal-view-comment': paModalLastObjectiveCtrl.IsReadOnly}">

        <div class="comment"
             ng-bind="paModalLastObjectiveCtrl.LastCompletedPercentObjective"
             ng-if="paModalLastObjectiveCtrl.IsReadOnly"></div>

        <form class="form-horizontal" role="form"
              ng-if="!paModalLastObjectiveCtrl.IsReadOnly">
            <div class="form-group">
                <label class="col-sm-2 control-label text-left">
                    <span data-translate="Objectives"></span>
                </label>
                <div class="col-sm-10 field">
                    <textarea type="text" class="form-control none-resize" maxlength="8000"
                              ng-model="paModalLastObjectiveCtrl.LastCompletedPercentObjective"
                              rows="20"></textarea>
                </div>
            </div>
        </form>

    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="paModalLastObjectiveCtrl.cancel()">
            <span ng-if="paModalLastObjectiveCtrl.IsReadOnly" data-translate="Close"></span>
            <span ng-if="!paModalLastObjectiveCtrl.IsReadOnly" data-translate="Cancel"></span>
        </button>
        <button class="button" ng-click="paModalLastObjectiveCtrl.ok()" data-translate="Submit" ng-if="!paModalLastObjectiveCtrl.IsReadOnly"></button>
    </div>
</div>
