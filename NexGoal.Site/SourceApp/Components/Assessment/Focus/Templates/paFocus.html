<div ng-controller="PAFocusController as paFocusCtrl">

    <br />

    <div class="panel-group dashboard">
        <div class="panel panel-default no-border">
            <div class="panel-heading level-2">
                <h4 class="panel-title" data-translate="EvaluationProcess"></h4>
            </div>

            <div class="panel-body">
                <div class="evaluation-process-section"
                     ng-include src="'/SourceApp/Components/Assessment/Focus/Templates/focusProcess.html'">
                </div>
            </div>
        </div>
    </div>

    <form novalidate class="form-inline filter">

        <div class="form-group">

            <div class="col">
                <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="paFocusCtrl.filter.periodId"
                            ng-options="item.PeriodId as item.Name group by item.Year for item in paFocusCtrl.periods"></select>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="paFocusCtrl.teams" button-label="Name"
                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Employee"></label>
                <div class="control-content">
                    <input class="form-control employe-search" placeholder="Enter full name or nick name" search-auto-complete
                           ng-model="paFocusCtrl.searchEmployee"
                           search-employees="paFocusCtrl.getEmployee()"
                           ng-change="paFocusCtrl.unSelectEmployee()"
                           employee="paFocusCtrl.filter.employee" />
                </div>
            </div>

            <div class="col button-block">
                <button class="button" ng-click="paFocusCtrl.query()" data-translate="Submit"></button>
                <button class="button btnExcel" export-focus ng-click="paFocusCtrl.exportExcel()"> Excel</button>
            </div>

            <div class="col">

            </div>

        </div>

    </form>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th data-translate="SymbolCount"></th>
                <th data-translate="FullName"></th>
                <th data-translate="NickName"></th>
                <th data-translate="JobTitle"></th>
                <th data-translate="SuitableForTeamGoals"></th>
                <th data-translate="DeserveRewards"></th>
                <th data-translate="ApplicableToPromote"></th>
                <th data-translate="PoorPerformance"></th>
                <th data-translate="AccomplishedCurrentObjectives"></th>
                <th data-translate="PAScore"></th>
                <th colspan="2" data-translate="NextObjectives"></th>
            </tr>
        </thead>

        <!--ng-show="groups.length === 0"-->

        <tbody>
            <tr>
                <td class="text-center empty-result" colspan="12" data-translate="EmptyResult"></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td>
                    <select class="form-control">
                        <option value="item.Value" ng-repeat="item in paFocusCtrl.focusEvaluationLevel">{{item.Name}}</option>
                    </select>
                </td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>

    <div class="navbar navbar-default navbar-fixed-bottom action-section">
        <button class="btn btn-back" data-translate="Reset" ng-click="paFocusCtrl.query()"></button>
        <button class="btn button-save" data-translate="Save" ng-click="paFocusCtrl.save()"></button>
    </div>
</div>
