<div ng-controller="PAFocusController as paFocusCtrl">
    <form novalidate class="form-inline filter">

        <div class="form-group">

            <div class="col">
                <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="paFocusCtrl.filter.periodId"
                            ng-options="item.PeriodId as item.Name group by item.Year for item in paFocusCtrl.periods"></select>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="paFocusCtrl.teams" button-label="Name"
                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Employee"></label>
                <div class="control-content">
                    <input class="form-control employe-search" placeholder="-- Search an employee --" search-auto-complete
                           ng-model="paFocusCtrl.searchEmployee"
                           search-employees="paFocusCtrl.getEmployee()"
                           ng-change="paFocusCtrl.unselectEmployee()"
                           employee="paFocusCtrl.filter.employee" />
                </div>
            </div>

            <div class="col button-block">
                <button class="button" ng-click="paFocusCtrl.query()" data-translate="Search"></button>
                <button class="button btnExcel" export-focus ng-click="paFocusCtrl.exportExcel()" data-translate="Excel"></button>
            </div>
        </div>
    </form>

    <div class="focus-process evaluation-process-section" ng-if="paFocusCtrl.process[0] !== null"
         ng-include src="'/SourceApp/Components/Assessment/Focus/Templates/focusProcess.html'">
    </div>

    <table class="table table-bordered table-striped pa-focus-table employee-performance-table comment-wrapper">
        <thead>
            <tr>
                <th data-translate="SymbolCount"></th>
                <th data-translate="NickName"></th>
                <th data-translate="FullName"></th>
                <th data-translate="JobTitle"></th>
                <th class="width-220">
                    {{"SuitableForTeamGoals" | translate}}
                    <i tooltip-html-unsafe='{{"SuitableForTeamGoals"| translate}}:<span style="color:#324373;font-weight: bold;"> {{"PAFocusFirstNote" | translate}} </span>' class="fa fa-info-circle icon-info"></i>
                </th>
                <th class="width-220">
                    {{"DeserveRewards" | translate}}
                    <i tooltip-html-unsafe='{{"DeserveRewards"| translate}}: <span style="color:#324373;font-weight: bold;">{{"PAFocusSecondNote" | translate}} </span>' class="fa fa-info-circle icon-info"></i>
                </th>
                <th data-translate="ApplicableToPromote"></th>
                <th data-translate="PoorPerformance"></th>
                <th colspan="2" data-translate="AccomplishedCurrentObjectives"></th>
                <th data-translate="PAScore"></th>
                <th colspan="2" data-translate="NextObjectives"></th>
            </tr>
        </thead>
        <tbody ng-if="groups.length === 0">
            <tr>
                <td class="text-center empty-result" colspan="13" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tbody ng-if="groups.length > 0" ng-repeat="group in groups">
            <tr class="group-row">
                <td colspan="13">{{group.Name}}</td>
            </tr>
            <tr ng-repeat="member in group.Members"
                ng-class="{'noticeable-performance very-good': member.Contribution + member.BonusGiven>
                8 && !member.IsReadyPromotion,
                'noticeable-performance outstanding': member.Contribution + member.BonusGiven > 8 && member.IsReadyPromotion,
                'noticeable-performance poor': member.Contribution + member.BonusGiven < 4 && member.Contribution > 0 && member.BonusGiven > 0 }">
                <td class="text-center" ng-bind="$index + 1"></td>
                <td ng-bind="member.Employee.NickName"></td>
                <td ng-bind="member.Employee.FullName"></td>
                <td ng-bind="member.Employee.JobTitle.JobTitleName"></td>
                <td class="text-center">
                    <select class="form-control"
                            ng-model="member.Contribution"
                            ng-if="member.IsAllowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.focusEvaluationLevel"></select>
                    <span ng-bind="::paFocusCtrl.getFocusEvaluationLevel(member.Contribution)"
                          ng-if="!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></span>
                </td>
                <td class="text-center">
                    <select class="form-control"
                            ng-model="member.BonusGiven"
                            ng-if="member.IsAllowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.focusEvaluationLevel"></select>
                    <span ng-bind="::paFocusCtrl.getFocusEvaluationLevel(member.BonusGiven)"
                          ng-if="!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></span>
                </td>
                <td class="text-center">
                    <select class="form-control focus-evaluation-status default-select"
                            ng-class="{'good': member.IsReadyPromotion, 'normal': !member.IsReadyPromotion}"
                            ng-model="member.IsReadyPromotion"
                            ng-if="member.IsAllowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.booleanRanges"
                            ng-change="paFocusCtrl.onIsReadyPromotionFieldChange(member)"></select>
                    <span class="focus-evaluation-status"
                          ng-class="{'good': member.IsReadyPromotion, 'normal': !member.IsReadyPromotion}"
                          ng-if="!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"
                          ng-bind="::member.IsReadyPromotion ? 'Yes' : (member.IsReadyPromotion === null ? '-' : 'No')">
                    </span>
                </td>
                <td class="text-center">
                    <select class="form-control focus-evaluation-status default-select"
                            ng-class="{'warning': member.IsPoorPerformance, 'normal': !member.IsPoorPerformance}"
                            ng-model="member.IsPoorPerformance"
                            ng-if="member.IsAllowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.booleanRanges"
                            ng-change="paFocusCtrl.onIsPoorPerformanceFieldChange(member)"></select>
                    <span class="focus-evaluation-status"
                          ng-class="{'warning': member.IsPoorPerformance, 'normal': !member.IsPoorPerformance}"
                          ng-if="!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"
                          ng-bind="::member.IsPoorPerformance ? 'Yes' : (member.IsPoorPerformance === null ? '-' : 'No')">
                    </span>
                </td>
                <td ng-class="{'text-center': member.LastCompletedPercentObjective.length === 0}">
                    <span data-translate="Dash"
                          ng-if="member.LastCompletedPercentObjective.length === 0"></span>
                    <span ng-show='member.LastCompletedPercentObjective.length > 0 && member.LastCompletedPercentObjective.length <= 25'
                          ng-bind="member.LastCompletedPercentObjective"></span>
                    <span ng-show='member.LastCompletedPercentObjective.length > 25'>{{member.LastCompletedPercentObjective | limitTo : 25}} ...</span>
                </td>
                <td class="text-center">
                    <a href=""
                       ng-click="paFocusCtrl.openPopupLastObjective(member)"
                       ng-if="vm.permission === vm.policy.Host && member.IsAllowToEdit">
                        <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                    </a>

                    <a href=""
                       ng-click="paFocusCtrl.openPopupLastObjective(member)"
                       ng-show='(!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host) && member.LastCompletedPercentObjective.length > 0'>
                        <i class="fa fa-search" aria-hidden="true"></i>
                    </a>

                    <span data-translate="Dash"
                          ng-if="(!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host) &&
                          member.LastCompletedPercentObjective.length === 0"></span>
                </td>
                <td class="text-center">
                    <span ng-if="member.FinalScore">{{member.FinalScore | integerScore}}</span>
                    <span ng-if="!member.FinalScore" data-translate="Dash"></span>
                </td>
                <td ng-class="{'text-center': member.NextDescriptionObjective.length === 0}">
                    <span data-translate="Dash"
                          ng-if="member.NextDescriptionObjective.length === 0"></span>
                    <span ng-show='member.NextDescriptionObjective.length > 0 && member.NextDescriptionObjective.length <= 25'
                          ng-bind="member.NextDescriptionObjective"></span>
                    <span ng-show='member.NextDescriptionObjective.length > 25'>{{member.NextDescriptionObjective | limitTo : 25}} ...</span>
                </td>
                <td class="text-center">
                    <a href=""
                       ng-click="paFocusCtrl.openPopupObjective(member)"
                       ng-if="vm.permission === vm.policy.Host && member.IsAllowToEdit">
                        <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                    </a>

                    <a href=""
                       ng-click="paFocusCtrl.openPopupObjective(member)"
                       ng-show='(!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host) && member.NextDescriptionObjective.length > 0'>
                        <i class="fa fa-search" aria-hidden="true"></i>
                    </a>

                    <span data-translate="Dash"
                          ng-if="(!member.IsAllowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host) &&
                          member.NextDescriptionObjective.length === 0"></span>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="navbar navbar-default navbar-fixed-bottom action-section"
         ng-if="groups.length > 0 && vm.permission === vm.policy.Host && member.IsAllowToEdit"
         ng-class="{'full-size': !menuVisibility}">
        <button class="button btn-cancel" data-translate="Reset" ng-click="paFocusCtrl.query()"></button>
        <button class="button" data-translate="Submit" ng-click="paFocusCtrl.save()"></button>
        <span>{{pageCtrl.menuVisibility}}</span>
    </div>
</div>
