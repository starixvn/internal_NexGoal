<div ng-controller="PAFocusController as paFocusCtrl">
    <form novalidate class="form-inline filter">

        <div class="form-group">

            <div class="col">
                <label class="control-label size-l" data-translate="EvaluationPeriod"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="paFocusCtrl.filter.periodId"
                            ng-options="item.PeriodId as item.Name group by item.Year for item in paFocusCtrl.periods"></select>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                    <add-class-to-role-filter class="multi-select" multi-select input-model="paFocusCtrl.teams" button-label="Name"
                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                    </add-class-to-role-filter>
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Employee"></label>
                <div class="control-content">
                    <input class="form-control employe-search" placeholder="Enter full name or nick name" search-auto-complete
                           ng-model="paFocusCtrl.searchEmployee"
                           search-employees="paFocusCtrl.getEmployee()"
                           ng-change="paFocusCtrl.unSelectEmployee()"
                           employee="paFocusCtrl.filter.employee" />
                </div>
            </div>

            <div class="col button-block">
                <button class="button" ng-click="paFocusCtrl.query()" data-translate="Search"></button>
                <button class="button btnExcel" export-focus ng-click="paFocusCtrl.exportExcel()" data-translate="Excel"></button>
            </div>

        </div>

    </form>

    <div class="panel-group dashboard">
        <div class="panel panel-default no-border">
            <div class="panel-heading level-2">
                <h4 class="panel-title" data-translate="EvaluationProcess"></h4>
            </div>

            <div class="panel-body">
                <div class="evaluation-process-section"
                     ng-include src="'/SourceApp/Components/Assessment/Focus/Templates/focusProcess.html'">
                </div>
            </div>
        </div>
    </div>

    <table class="table table-bordered table-striped pa-focus-table employee-performance-table">
        <thead>
            <tr>
                <th data-translate="SymbolCount"></th>
                <th data-translate="FullName"></th>
                <th data-translate="NickName"></th>
                <th data-translate="JobTitle"></th>
                <th class="width-220" data-translate="SuitableForTeamGoals"></th>
                <th class="width-220" data-translate="DeserveRewards"></th>
                <th data-translate="ApplicableToPromote"></th>
                <th data-translate="PoorPerformance"></th>
                <th colspan="2" data-translate="AccomplishedCurrentObjectives"></th>
                <th data-translate="PAScore"></th>
                <th colspan="2" data-translate="NextObjectives"></th>
            </tr>
        </thead>
        <tbody ng-show="groups.length === 0">
            <tr>
                <td class="text-center empty-result" colspan="13" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tbody ng-show="groups.length > 0" ng-repeat="group in groups">
            <tr class="group-row">
                <td colspan="13">{{group.Name}}</td>
            </tr>
            <tr ng-repeat="member in group.Members"
                ng-class="{'outstanding': member.Contribution + member.BonusGiven === 10, 'very-good': member.Contribution + member.BonusGiven === 9}">
                <td class="text-center" ng-bind="$index + 1"></td>
                <td ng-bind="member.Employee.FullName"></td>
                <td class="text-center" ng-bind="member.Employee.NickName"></td>
                <td ng-bind="member.Employee.JobTitle.JobTitleName"></td>
                <td class="text-center">
                    <select class="form-control"
                            ng-model="member.Contribution"
                            ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.focusEvaluationLevel"></select>
                    <span ng-bind="::paFocusCtrl.getFocusEvaluationLevel(member.Contribution)"
                          ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></span>
                </td>
                <td class="text-center">
                    <select class="form-control"
                            ng-model="member.BonusGiven"
                            ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.focusEvaluationLevel"></select>
                    <span ng-bind="::paFocusCtrl.getFocusEvaluationLevel(member.Contribution)"
                          ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></span>
                </td>
                <td class="text-center">
                    <select class="form-control focus-evaluation-status default-select"
                            ng-class="{'good': member.IsReadyPromotion, 'normal': !member.IsReadyPromotion}"
                            ng-model="member.IsReadyPromotion"
                            ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.booleanRanges"></select>
                    <span class="focus-evaluation-status"
                          ng-class="{'good': member.IsReadyPromotion, 'normal': !member.IsReadyPromotion}"
                          ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"
                          ng-bind="::member.IsReadyPromotion ? 'Yes' : (member.IsReadyPromotion === null ? '-' : 'No')">
                    </span>
                </td>
                <td class="text-center">
                    <select class="form-control focus-evaluation-status default-select"
                            ng-class="{'warning': member.IsPoorPerformance, 'normal': !member.IsPoorPerformance}"
                            ng-model="member.IsPoorPerformance"
                            ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"
                            ng-options="item.Value as item.Name for item in paFocusCtrl.booleanRanges"></select>
                    <span class="focus-evaluation-status"
                          ng-class="{'good': member.IsPoorPerformance, 'normal': !member.IsPoorPerformance}"
                          ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"
                          ng-bind="::member.IsPoorPerformance ? 'Yes' : (member.IsPoorPerformance === null ? '-' : 'No')">
                    </span>
                </td>
                <td>
                    <span ng-show="member.LastCompletedPercentObjective.length <= 25">{{member.LastCompletedPercentObjective}}</span>
                    <span ng-show="member.LastCompletedPercentObjective.length > 25">{{member.LastCompletedPercentObjective | limitTo : 25}} ...</span>
                </td>
                <td class="text-center">
                    <a href="" ng-click="paFocusCtrl.openPopupLastObjective(member)">
                        <i class="fa fa-pencil-square-o" aria-hidden="true"
                           ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"></i>
                        <i class="fa fa-search" aria-hidden="true"
                           ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></i>
                    </a>
                </td>
                <td class="text-center">
                    <span ng-if="member.FinalScore">{{member.FinalScore | customScore}}</span>
                    <span ng-if="!member.FinalScore" data-translate="NotAvailable"></span>
                </td>
                <td>
                    <span ng-show="member.NextDescriptionObjective.length <= 25">{{member.NextDescriptionObjective}}</span>
                    <span ng-show="member.NextDescriptionObjective.length > 25">{{member.NextDescriptionObjective | limitTo : 25}} ...</span>
                </td>
                <td class="text-center">
                    <a href="" ng-click="paFocusCtrl.openPopupObjective(member)">
                        <i class="fa fa-pencil-square-o" aria-hidden="true"
                           ng-show="paFocusCtrl.allowToEdit && paFocusCtrl.permission === paFocusCtrl.policy.Host"></i>
                        <i class="fa fa-search" aria-hidden="true"
                           ng-show="!paFocusCtrl.allowToEdit || paFocusCtrl.permission !== paFocusCtrl.policy.Host"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="navbar navbar-default navbar-fixed-bottom action-section"
         ng-show="groups.length > 0 && vm.permission === vm.policy.Host && paFocusCtrl.allowToEdit">
        <button class="button btn-cancel" data-translate="Reset" ng-click="paFocusCtrl.query()"></button>
        <button class="button" data-translate="Submit" ng-click="paFocusCtrl.save()"></button>
    </div>
</div>
