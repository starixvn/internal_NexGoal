<ul class="evaluation-process" ng-if="paFocusCtrl.process.length===2">
    <li ng-class="paFocusCtrl.getClassProgress(paFocusCtrl.process[0].ProcessStatus)" class="process-item">
        <div>
            <span>{{"Evaluator" | translate}} </span>
        </div>
        <div>
            <span>
                {{paFocusCtrl.process[0].StartDate | customDate}} -
                {{paFocusCtrl.process[0].EndDate | customDate}}
            </span>
        </div>
        <div ng-if="paFocusCtrl.process[0].ProcessStatus == paFocusCtrl.processStatus.Closed">
            <label data-translate="Completed"></label><i class="fa fa-check-square-o" aria-hidden="true"></i>
        </div>
        <div ng-if="paFocusCtrl.process[0].ProcessStatus == paFocusCtrl.processStatus.InProgress">
            <label data-translate="InProgress"></label><i class="fa fa-spinner" aria-hidden="true"></i>
        </div>
        <div ng-if="paFocusCtrl.process[0].ProcessStatus == paFocusCtrl.processStatus.Open" aria-hidden="true">
            <label data-translate="Open"></label><i class="fa fa-hourglass-start" aria-hidden="true"></i>
        </div>
    </li>
    <li ng-class="paFocusCtrl.getClassProgress(paFocusCtrl.process[1].ProcessStatus)" class="process-item">
        <div>
            <span>{{"Reviewer" | translate}} / {{"Management" | translate}}</span>
        </div>
        <div>
            <span>
                {{paFocusCtrl.process[1].StartDate | customDate}}
            </span>
        </div>
        <div ng-show="paFocusCtrl.process[1].ProcessStatus == paFocusCtrl.processStatus.Closed">
            <label data-translate="Completed"></label><i class="fa fa-check-square-o" aria-hidden="true"></i>
        </div>
        <div ng-show="paFocusCtrl.process[1].ProcessStatus == paFocusCtrl.processStatus.InProgress">
            <label data-translate="InProgress"></label><i class="fa fa-spinner" aria-hidden="true"></i>
        </div>
        <div ng-if="paFocusCtrl.process[1].ProcessStatus == paFocusCtrl.processStatus.Open">
            <label data-translate="Open"></label><i class="fa fa-hourglass-start" aria-hidden="true"></i>
        </div>
    </li>   
</ul>
<div class="evaluation-process" ng-if="paFocusCtrl.process.length!==2">
    <div class="text-center empty-result" data-translate="EmptyResult"></div>
    <br/>
</div>
