<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span ng-show="paModalObjectiveCtrl.IsReadOnly" data-translate="ViewObjectives"></span>
            <span ng-show="!paModalObjectiveCtrl.IsReadOnly" data-translate="EditObjectives"></span>
            <span class="close-popup" ng-click="paModalObjectiveCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body modal-update-comment">
        <form class="form-horizontal" role="form">
            <div ng-show="paModalObjectiveCtrl.IsReadOnly">
                <textarea type="text" class="form-control none-resize ready-only"
                          ng-model="paModalObjectiveCtrl.NextDescriptionObjective"
                          rows="20"
                          readonly></textarea>
            </div>
            <div class="form-group" 
                 ng-show="!paModalObjectiveCtrl.IsReadOnly">
                <label class="col-sm-2 control-label text-left">
                    <span data-translate="Objectives"></span>
                </label>
                <div class="col-sm-10 field">
                    <textarea class="form-control none-resize"
                              ng-model="paModalObjectiveCtrl.NextDescriptionObjective"
                              rows="20"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="paModalObjectiveCtrl.cancel()">
            <span ng-show="paModalObjectiveCtrl.IsReadOnly" data-translate="Close"></span>
            <span ng-show="!paModalObjectiveCtrl.IsReadOnly" data-translate="Cancel"></span>
        </button>
        <button class="button" ng-click="paModalObjectiveCtrl.ok()" data-translate="Submit" ng-show="!paModalObjectiveCtrl.IsReadOnly"></button>
    </div>
</div>
