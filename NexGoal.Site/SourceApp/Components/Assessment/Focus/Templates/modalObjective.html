<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span ng-if="paModalObjectiveCtrl.IsReadOnly" data-translate="ViewObjectives"></span>
            <span ng-if="!paModalObjectiveCtrl.IsReadOnly" data-translate="EditObjectives"></span>
            <span class="close-popup" ng-click="paModalObjectiveCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body"
         ng-class="{'modal-view-comment': paModalObjectiveCtrl.IsReadOnly}">

        <div class="comment"
             ng-bind="paModalObjectiveCtrl.NextDescriptionObjective"
             ng-if="paModalObjectiveCtrl.IsReadOnly"></div>

        <form class="form-horizontal" role="form"
              ng-if="!paModalObjectiveCtrl.IsReadOnly">
            <div class="form-group">
                <label class="col-sm-2 control-label text-left">
                    <span data-translate="Objectives"></span>
                </label>
                <div class="col-sm-10 field">
                    <textarea type="text" class="form-control none-resize" maxlength="8000"
                              ng-model="paModalObjectiveCtrl.NextDescriptionObjective"
                              rows="20"></textarea>
                </div>
            </div>
        </form>

    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="paModalObjectiveCtrl.cancel()">
            <span ng-if="paModalObjectiveCtrl.IsReadOnly" data-translate="Close"></span>
            <span ng-if="!paModalObjectiveCtrl.IsReadOnly" data-translate="Cancel"></span>
        </button>
        <button class="button" ng-click="paModalObjectiveCtrl.ok()" data-translate="Submit" ng-if="!paModalObjectiveCtrl.IsReadOnly"></button>
    </div>
</div>
