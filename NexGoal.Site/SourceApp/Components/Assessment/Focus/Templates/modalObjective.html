<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span>{{"EditObjectives" | translate}}</span>
        </div>
    </div>
    <div class="modal-body modal-update-comment">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-3 control-label text-left">
                    <span data-translate="Objectives"></span>
                </label>
                <div class="col-sm-9 field">
                    <textarea type="text" class="form-control comment"
                              ng-model="paModalObjectiveCtrl.NextDescriptionObjective"
                              ng-readonly="paModalObjectiveCtrl.IsReadOnly"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button" ng-click="paModalObjectiveCtrl.ok()" data-translate="OK"></button>
        <button class="button btn-cancel customize" ng-click="paModalObjectiveCtrl.cancel()" data-translate="Cancel" ng-show="!paModalObjectiveCtrl.IsReadOnly"></button>
    </div>
</div>
