<div ng-controller="ManageNominationController as manageNominationCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current" data-translate="ManageNomination"></li>
            </ul>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset>
                <tab class="tab-cursor" active="manageNominationCtrl.dataTab.eoq" select="manageNominationCtrl.tabEOQSelected()">
                    <tab-heading data-translate="EOQ"></tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/EmployeeAward/Quarter/Templates/manageEOQ.html'"></div>
                </tab>
                <tab class="tab-cursor" active="manageNominationCtrl.dataTab.eoy" select="manageNominationCtrl.tabEOYSelected()">
                    <tab-heading data-translate="EOY"></tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/EmployeeAward/Year/Templates/manageEOY.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
