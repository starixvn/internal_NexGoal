<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="NominationForm"></span>
            <span class="close-popup" ng-click="viewEOYNominationCtrl.close()"></span>
        </div>
    </div>
    <div class="modal-body modal-scrollable">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Nominee"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-disabled="true"
                           value="{{viewEOYNominationCtrl.nomination.Nominee.FullName}} ({{viewEOYNominationCtrl.nomination.Nominee.NickName}})" />
                </div>
                <label class="col-sm-1 control-label" data-translate="Team"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="viewEOYNominationCtrl.nomination.Nominee.Group.GroupName" ng-disabled="true" />
                </div>
                <label class="col-sm-1 control-label" data-translate="Nominator"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-disabled="true"
                           value="{{viewEOYNominationCtrl.nomination.Nominator.FullName}} ({{viewEOYNominationCtrl.nomination.Nominator.NickName}})" />
                </div>
            </div>
            <div class="form-group" ng-repeat="question in viewEOYNominationCtrl.nomination.NominationDetails">
                <label class="col-sm-12 control-label text-left">{{$index + 1}}. {{question.Name}}</label>
                <div class="col-sm-12 field">
                    <textarea class="form-control comment none-resize" rows="3" ng-model="question.Comment" maxlength="1000" ng-disabled="true"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel" ng-click="viewEOYNominationCtrl.close()" data-translate="Close"></button>
    </div>
</div>
