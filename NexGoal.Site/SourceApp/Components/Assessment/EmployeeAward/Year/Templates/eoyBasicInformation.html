<div ng-controller="UpdateEOYBasicInformationController as eoyBasicInfoCtrl">
    <form class="col-sm-12 col-lg-12 form-horizontal common-form info-form" novalidate>
        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Year"></label>
            <div class="col-sm-2 field">
                <select class="form-control" ng-model="eoyBasicInfoCtrl.period.Year">
                    <option value=""></option>
                    <option ng-repeat="year in eoyBasicInfoCtrl.years" value="{{year}}">{{year}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-1 control-label required-label" data-translate="StartDate"></label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" datepicker-popup
                       ng-model="eoyBasicInfoCtrl.period.RawStartDate"
                       ng-click="eoyBasicInfoCtrl.openPopupStartDate($event)" min-date="{{eoyBasicInfoCtrl.calendar.minDate}}"
                       is-open="eoyBasicInfoCtrl.calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="eoyBasicInfoCtrl.openPopupStartDate($event)"></calendar-image>
            </div>

            <label class="col-sm-1 control-label required-label" data-translate="EndDate"></label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" datepicker-popup
                       ng-model="eoyBasicInfoCtrl.period.RawEndDate"
                       ng-click="eoyBasicInfoCtrl.openPopupEndDate($event)" min-date="{{eoyBasicInfoCtrl.calendar.minDate}}"
                       is-open="eoyBasicInfoCtrl.calendar.endDateOpened" />
                <calendar-image class="calendar-image" ng-click="eoyBasicInfoCtrl.openPopupEndDate($event)"></calendar-image>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-1 control-label required-label" data-translate="RemindDate"></label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" datepicker-popup
                       ng-model="eoyBasicInfoCtrl.period.RawRemindDate"
                       ng-click="eoyBasicInfoCtrl.openPopupRemindDate($event)" min-date="{{eoyBasicInfoCtrl.calendar.minDate}}"
                       is-open="eoyBasicInfoCtrl.calendar.remindDateOpened" />
                <calendar-image class="calendar-image" ng-click="eoyBasicInfoCtrl.openPopupRemindDate($event)"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Description"></label>
            <div class="col-sm-5 field">
                <textarea type="text" class="form-control comment" rows="3" ng-model="eoyBasicInfoCtrl.period.Description"></textarea>
            </div>
        </div>
        <div class="col-sm-offset-1 button-block">
            <button class="button" data-translate="Submit" ng-click="eoyBasicInfoCtrl.save(eoyBasicInfoCtrl.period)"
                    ng-show="eoyBasicInfoCtrl.permission == eoyBasicInfoCtrl.policyEnum.Host"></button>
        </div>
    </form>
</div>
