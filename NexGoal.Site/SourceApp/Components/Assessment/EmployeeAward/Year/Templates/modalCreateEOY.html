<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="CreateNominationPeriod"></span>
            <span class="close-popup" ng-click="createEOYCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-3 control-label required-label" data-translate="Year"></label>
                <div class="col-sm-3 field">
                    <select class="form-control" ng-model="createEOYCtrl.period.Year">
                        <option value=""></option>
                        <option ng-repeat="year in createEOYCtrl.years" value="{{year}}">{{year}}</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label required-label" data-translate="StartDateForNominator"></label>
                <div class="col-sm-3 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="createEOYCtrl.period.RawStartDate"
                           ng-click="createEOYCtrl.openPopupStartDate($event)"
                           is-open="createEOYCtrl.calendar.startDateOpened" />
                    <calendar-image class="calendar-image" ng-click="createEOYCtrl.openPopupStartDate($event)"></calendar-image>
                </div>

                <label class="col-sm-3 control-label required-label" data-translate="EndDateForNominator"></label>
                <div class="col-sm-3 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="createEOYCtrl.period.RawEndDate"
                           ng-click="createEOYCtrl.openPopupEndDate($event)"
                           is-open="createEOYCtrl.calendar.endDateOpened" />
                    <calendar-image class="calendar-image" ng-click="createEOYCtrl.openPopupEndDate($event)"></calendar-image>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label required-label" data-translate="RemindDateForNominator"></label>
                <div class="col-sm-3 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="createEOYCtrl.period.RawRemindDate"
                           ng-click="createEOYCtrl.openPopupRemindDate($event)"
                           is-open="createEOYCtrl.calendar.remindDateOpened" />
                    <calendar-image class="calendar-image" ng-click="createEOYCtrl.openPopupRemindDate($event)"></calendar-image>
                </div>

                <label class="col-sm-3 control-label required-label" data-translate="EndDateForCommittee"></label>
                <div class="col-sm-3 field">
                    <input readonly class="calendar-form-control" type="text" datepicker-popup
                           ng-model="createEOYCtrl.period.RawEndDateForCommittee"
                           ng-click="createEOYCtrl.openPopupEndDateForCommittee($event)"
                           is-open="createEOYCtrl.calendar.endDateForCommitteeOpened" />
                    <calendar-image class="calendar-image" ng-click="createEOYCtrl.openPopupEndDateForCommittee($event)"></calendar-image>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label" data-translate="Description"></label>
                <div class="col-sm-9 field">
                    <textarea type="text" class="form-control comment none-resize" rows="5" ng-model="createEOYCtrl.period.Description"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel customize" ng-click="createEOYCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="createEOYCtrl.submit()" data-translate="Submit"></button>
    </div>
</div>
