<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span data-translate="NominationForm"></span>
            <span class="close-popup" ng-click="updateEOYNominationCtrl.cancel()"></span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Nominee"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="updateEOYNominationCtrl.nomination.fullName" ng-disabled="true" />
                </div>
                <label class="col-sm-1 control-label" data-translate="Team"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="updateEOYNominationCtrl.nomination.groupName" ng-disabled="true" />
                </div>
                <label class="col-sm-1 control-label" data-translate="DueDate"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="updateEOYNominationCtrl.nomination.dueDate" ng-disabled="true" />
                </div>
            </div>
            <div class="form-group" ng-repeat="question in updateEOYNominationCtrl.nomination.eoyQuestions">
                <label class="col-sm-12 control-label required-label text-left">{{$index + 1}}. {{question.Name}}</label>
                <div class="col-sm-12 field"
                     ng-class="{'has-error': !question.IsValid}">
                    <textarea class="form-control comment none-resize" rows="3" ng-model="question.Comment" maxlength="1000"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button btn-cancel customize" ng-click="updateEOYNominationCtrl.cancel()" data-translate="Cancel"></button>
        <button class="button" ng-click="updateEOYNominationCtrl.submit()" data-translate="Submit"></button>
    </div>
</div>
