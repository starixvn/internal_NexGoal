<div ng-controller="ViewEOYDetailController as viewEOYDetailCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb period-breadcrumb">
                <li class="current" data-translate="NominationManagement"></li>
            </ul>
            <div class="button-block">
                <a class="button btn-cancel" ng-click="viewEOYDetailCtrl.backToList()">
                    <i class="fa fa-angle-left icon-back"></i> {{"BackToList" | translate}}
                </a>
            </div>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset>
                <tab class="tab-cursor" active="viewEOYDetailCtrl.dataTab.basicInformation" select="viewEOYDetailCtrl.tabBasicInformationSelected()">
                    <tab-heading data-translate="Settings"></tab-heading>
                    <form class="col-sm-12 col-lg-12 form-horizontal common-form info-form" novalidate>
                        <div class="form-group">
                            <label class="col-sm-1 control-label" data-translate="Year"></label>
                            <div class="col-sm-2 field">
                                <input class="form-control" ng-model="viewEOYDetailCtrl.period.Year" ng-disabled="true" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-1 control-label" data-translate="StartDate"></label>
                            <div class="col-sm-2 field">
                                <input class="form-control"
                                       ng-model="viewEOYDetailCtrl.period.RawStartDate"
                                       ng-disabled="true" />
                            </div>

                            <label class="col-sm-1 control-label" data-translate="EndDate"></label>
                            <div class="col-sm-2 field">
                                <input class="form-control"
                                       ng-model="viewEOYDetailCtrl.period.RawEndDate"
                                       ng-disabled="true" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="col-sm-1 control-label" data-translate="Description"></label>
                            <div class="col-sm-5 field">
                                <textarea type="text" class="form-control comment" rows="3"
                                          ng-model="viewEOYDetailCtrl.period.Description"
                                          ng-disabled="true"></textarea>
                            </div>
                        </div>
                    </form>
                </tab>

                <tab class="tab-cursor" active="viewEOYDetailCtrl.dataTab.rolesManagement" select="viewEOYDetailCtrl.tabRolesManagementSelected()">
                    <tab-heading data-translate="RoleManagement"></tab-heading>
                    <form novalidate class="form-inline filter">
                        <div class="form-group">
                            <div class="col">
                                <label class="control-label" data-translate="Employee"></label>
                                <div class="control-content">
                                    <input class="form-control" placeholder="Enter full name or nick name"
                                           ng-model="viewEOYDetailCtrl.filter.query" />
                                </div>
                            </div>

                            <div class="col">
                                <label class="control-label" data-translate="Team"></label>
                                <div class="control-content">
                                    <add-class-to-role-filter class="multi-select" multi-select input-model="viewEOYDetailCtrl.teams" button-label="Name"
                                                              helper-elements="all none filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                                    </add-class-to-role-filter>
                                </div>
                            </div>

                            <div class="col">
                                <label class="control-label" data-translate="Roles"></label>
                                <div class="control-content">
                                    <select class="form-control" ng-model="viewEOYDetailCtrl.filter.roleId">
                                        <option value="">-- {{"All" | translate}} --</option>
                                        <option value="1" data-translate="Nominator"></option>
                                        <option value="2" data-translate="Committee"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col">
                                <div class="control-label size-xl">
                                    <input id="show-all-employee" type="checkbox" ng-model="viewEOYDetailCtrl.filter.showAllEmployee" />
                                    <label for="show-all-employee" data-translate="ShowAllEmployee"></label>
                                </div>
                            </div>

                            <div class="col button-block">
                                <button class="button" ng-click="viewEOYDetailCtrl.query()" data-translate="Search"></button>
                            </div>
                        </div>
                    </form>

                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr class="header-table">
                                <th colspan="7">
                                    <input type="text" class="search-inline-textbox search pull-right"
                                           ng-model="viewEOYDetailCtrl.searchKey"
                                           ng-change="viewEOYDetailCtrl.search()" />
                                </th>
                            </tr>
                            <tr class="headerName">
                                <th data-translate="SymbolCount"></th>
                                <th data-translate="NickName"></th>
                                <th data-translate="FullName"></th>
                                <th data-translate="JobTitle"></th>
                                <th data-translate="Team"></th>
                                <th data-translate="Committee"></th>
                                <th data-translate="Nominator"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr dir-paginate="nominator in viewEOYDetailCtrl.filteredItems | itemsPerPage: viewEOYDetailCtrl.pageSize"
                                current-page="viewEOYDetailCtrl.currentPage">
                                <td class="text-center"
                                    ng-bind="viewEOYDetailCtrl.getIndex($index, viewEOYDetailCtrl.currentPage, viewEOYDetailCtrl.pageSize)"></td>
                                <td class="text-center" ng-bind="nominator.NominatorInfo.NickName"></td>
                                <td ng-bind="nominator.NominatorInfo.FullName"></td>
                                <td ng-bind="nominator.NominatorInfo.JobTitle.JobTitleName"></td>
                                <td ng-bind="nominator.NominatorInfo.Group.GroupName"></td>
                                <td class="text-center">
                                    <input type="checkbox" ng-model="nominator.IsInBoard" ng-disabled="true" />
                                </td>
                                <td class="text-center">
                                    <input type="checkbox" ng-model="nominator.IsNominator" ng-disabled="true" />
                                </td>
                            </tr>
                            <tr ng-show="viewEOYDetailCtrl.filteredItems.length == 0">
                                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
                            </tr>
                        </tbody>
                        <tfoot ng-show="viewEOYDetailCtrl.filteredItems.length > 0">
                            <tr>
                                <td colspan="7" class="paging">
                                    <span data-translate="Show"></span>
                                    <select class="dropdown-entry" ng-model="viewEOYDetailCtrl.pageSize"
                                            ng-options="entry for entry in viewEOYDetailCtrl.entries"></select>
                                    <span data-translate="entries"></span>
                                    <div class="pull-right custom-paging">
                                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                                    </div>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </tab>
            </tabset>
        </div>
    </div>
</div>
