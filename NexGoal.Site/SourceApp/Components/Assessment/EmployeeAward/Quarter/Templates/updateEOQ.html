<div ng-controller="UpdateEOQController as updateEOQCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb period-breadcrumb">
                <li class="current" data-translate="NominationManagement"></li>
            </ul>
            <div class="button-block">
                <a class="button btn-cancel" ng-click="updateEOQCtrl.backToList()">
                    <i class="fa fa-angle-left icon-back"></i> {{"BackToList" | translate}}
                </a>
            </div>
        </div>
        <div class="col-sm-12 target-tabset">
            <tabset>
                <tab class="tab-cursor" active="updateEOQCtrl.dataTab.basicInformation" select="updateEOQCtrl.tabBasicInformationSelected()">
                    <tab-heading data-translate="Settings"></tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/EmployeeAward/Quarter/Templates/eoqBasicInformation.html'"></div>
                </tab>
                <tab class="tab-cursor" active="updateEOQCtrl.dataTab.rolesManagement" select="updateEOQCtrl.tabRolesManagementSelected()">
                    <tab-heading data-translate="RoleManagement"></tab-heading>
                    <div ng-include src="'/SourceApp/Components/Assessment/EmployeeAward/Quarter/Templates/eoqRolesManagement.html'"></div>
                </tab>
            </tabset>
        </div>
    </div>
</div>
