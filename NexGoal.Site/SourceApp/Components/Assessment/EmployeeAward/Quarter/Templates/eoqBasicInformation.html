<div ng-controller="UpdateEOQBasicInformationController as eoqBasicInfoCtrl">
    <form class="col-sm-12 col-lg-12 form-horizontal common-form info-form" novalidate>
        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Quarter"></label>
            <div class="col-sm-2 field">
                <input type="text" class="form-control"
                       ng-model="eoqBasicInfoCtrl.period.Quarter"
                       ng-show="eoqBasicInfoCtrl.period.StatusId === eoqBasicInfoCtrl.PERIOD_CLOSED_STATUS" 
                       ng-disabled="true"/>
                <select class="form-control"
                        ng-model="eoqBasicInfoCtrl.period.Quarter"
                        ng-show="eoqBasicInfoCtrl.period.StatusId !== eoqBasicInfoCtrl.PERIOD_CLOSED_STATUS">
                    <option value=""></option>
                    <option value="1">1st</option>
                    <option value="2">2nd</option>
                    <option value="3">3rd</option>
                    <option value="4">4th</option>
                </select>
            </div>

            <label class="col-sm-1 control-label" data-translate="Year"></label>
            <div class="col-sm-2 field">
                <input type="text" class="form-control"
                       ng-model="eoqBasicInfoCtrl.period.Year"
                       ng-show="eoqBasicInfoCtrl.period.StatusId === eoqBasicInfoCtrl.PERIOD_CLOSED_STATUS"
                       ng-disabled="true" />
                <select class="form-control"
                        ng-model="eoqBasicInfoCtrl.period.Year"
                        ng-show="eoqBasicInfoCtrl.period.StatusId !== eoqBasicInfoCtrl.PERIOD_CLOSED_STATUS">
                    <option value=""></option>
                    <option ng-repeat="year in eoqBasicInfoCtrl.years" value="{{year}}">{{year}}</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-1 control-label required-label" data-translate="StartDate"></label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" datepicker-popup
                       ng-model="eoqBasicInfoCtrl.period.RawStartDate"
                       ng-click="eoqBasicInfoCtrl.openPopupStartDate($event)" min-date="{{eoqBasicInfoCtrl.calendar.minDate}}"
                       is-open="eoqBasicInfoCtrl.calendar.startDateOpened" />
                <calendar-image class="calendar-image" ng-click="eoqBasicInfoCtrl.openPopupStartDate($event)"></calendar-image>
            </div>

            <label class="col-sm-1 control-label required-label" data-translate="EndDate"></label>
            <div class="col-sm-2 field">
                <input readonly class="calendar-form-control" type="text" datepicker-popup
                       ng-model="eoqBasicInfoCtrl.period.RawEndDate"
                       ng-click="eoqBasicInfoCtrl.openPopupEndDate($event)" min-date="{{eoqBasicInfoCtrl.calendar.minDate}}"
                       is-open="eoqBasicInfoCtrl.calendar.endDateOpened" />
                <calendar-image class="calendar-image" ng-click="eoqBasicInfoCtrl.openPopupEndDate($event)"></calendar-image>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-1 control-label" data-translate="Description"></label>
            <div class="col-sm-5 field">
                <textarea type="text" class="form-control comment" rows="3" ng-model="eoqBasicInfoCtrl.period.Description"></textarea>
            </div>
        </div>

        <div class="col-sm-offset-1 button-block">
            <button class="button" data-translate="Save" ng-click="eoqBasicInfoCtrl.save(eoqBasicInfoCtrl.period)"
                    ng-show="eoqBasicInfoCtrl.permission == eoqBasicInfoCtrl.policyEnum.Host"></button>
        </div>
    </form>
</div>
