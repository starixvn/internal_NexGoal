<div class="custom-modal">
    <div class="modal-header">
        <div class="popup-header">
            <span>Nominee Information</span>
        </div>
    </div>
    <div class="modal-body">
        <form class="form-horizontal" role="form">
            <div class="form-group">
                <label class="col-sm-1 control-label" data-translate="Nominee"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="viewEOQNominationCtrl.nomination.Nominee.FullName" ng-disabled="true" />
                </div>
                <label class="col-sm-1 control-label" data-translate="Team"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="viewEOQNominationCtrl.nomination.Nominee.Group.GroupName" ng-disabled="true" />
                </div>
                <label class="col-sm-1 control-label" data-translate="DueDate"></label>
                <div class="col-sm-3 field">
                    <input class="form-control" ng-model="viewEOQNominationCtrl.nomination.Period.DueDay" ng-disabled="true" />
                </div>
            </div>
            <div class="form-group" ng-repeat="question in viewEOQNominationCtrl.nomination.NominationDetails">
                <label class="col-sm-12 control-label text-left">{{$index + 1}}. {{question.Name}}</label>
                <div class="col-sm-12 field">
                    <textarea class="form-control" rows="3" ng-model="question.Comment" maxlength="1000"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer button-block">
        <button class="button" ng-click="viewEOQNominationCtrl.close()" data-translate="Close"></button>
    </div>
</div>
