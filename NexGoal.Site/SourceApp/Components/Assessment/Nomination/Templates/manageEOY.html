<div ng-controller="ManageEOYController as manageEOYCtrl">
    <form novalidate class="form-inline filter">
        <div class="form-group">
            <div class="col">
                <label class="control-label" data-translate="Year"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="manageEOYCtrl.filter.Year"
                            ng-options="year as year for year in manageEOYCtrl.years">
                        <option value="">-- {{"All" | translate}} --</option>
                    </select>
                </div>
            </div>
            <div class="col">
                <label class="control-label" data-translate="Status"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="manageEOYCtrl.filter.StatusId">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option class="nomination-period-status not-started" value="0" data-translate="NotStarted"></option>
                        <option class="nomination-period-status in-progress" value="1" data-translate="InProgress" selected></option>
                        <option class="nomination-period-status closed" value="2" data-translate="Closed"></option>
                    </select>
                </div>
            </div>
            <div class="col">
                <button class="button" ng-click="manageEOYCtrl.query()" data-translate="Search"></button>
            </div>
        </div>
    </form>

    <table class="row table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="6">
                    <a class="pull-left button-icon create-button"
                       ng-click="manageEOYCtrl.createEOY()"
                       ng-show="manageEOYCtrl.permission == manageEOYCtrl.policyEnum.Host">
                        <span class="icon plus"></span>
                        <span class="button-text" data-translate="CreateNominationPeriod"></span>
                    </a>
                    <input type="text" class="search-inline-textbox search pull-right"
                           ng-model="manageEOYCtrl.searchKey"
                           ng-change="manageEOYCtrl.search()" />
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="Year"></th>
                <th data-translate="StartDate"></th>
                <th data-translate="EndDate"></th>
                <th data-translate="Status"></th>
                <th data-translate="Action" ng-show="manageEOYCtrl.permission === manageEOYCtrl.policyEnum.Host"></th>
            </tr>
        </thead>
        <tbody>
            <tr class="text-center" dir-paginate="period in manageEOYCtrl.filteredItems | itemsPerPage: manageEOYCtrl.pageSize"
                current-page="manageEOYCtrl.currentPage">
                <td ng-bind="manageEOYCtrl.getIndex($index, manageEOYCtrl.currentPage, manageEOYCtrl.pageSize)"></td>
                <td ng-bind="period.Year"></td>
                <td ng-bind="period.StartDate | date: manageEOYCtrl.dateFormat"></td>
                <td ng-bind="period.EndDate | date: manageEOYCtrl.dateFormat"></td>
                <td ng-bind="period.StatusToString"
                    ng-class="{'not-started': period.StatusId === 0, 'in-progress': period.StatusId === 1, 'closed': period.StatusId === 2}"
                    class="nomination-period-status"></td>
                <td ng-show="manageEOYCtrl.permission === manageEOYCtrl.policyEnum.Host">
                    <div class="btn-group">
                        <a class="fa fa-pencil-square-o icon-edit" title="Edit"
                           ng-click="manageEOYCtrl.updateEOY(period.EOQYId)"></a>
                        <a class="fa fa-trash-o icon-remove" title="Delete" ng-click="manageEOYCtrl.deleteEOY(period)"></a>
                    </div>
                </td>
            </tr>
            <tr ng-show="manageEOYCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="6" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot ng-show="manageEOYCtrl.filteredItems.length > 0">
            <tr>
                <td colspan="6" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry" ng-model="manageEOYCtrl.pageSize"
                            ng-options="entry for entry in manageEOYCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>
</div>
