<div ng-controller="EOQAccessController as eoqAccessCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current">Employee of the {{eoqAccessCtrl.period.Period.QuarterToString}} {{eoqAccessCtrl.period.Period.Year}}</li>
            </ul>
        </div>
        <div class="col-sm-12">
            <form novalidate class="form-inline filter">
                <div class="form-group">
                    <div class="col">
                        <label class="control-label" data-translate="Keyword"></label>
                        <div class="control-content">
                            <input class="form-control" placeholder="Enter full name or nick name"
                                   ng-model="eoqAccessCtrl.filter.query" />
                        </div>
                    </div>
                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="eoqAccessCtrl.teams" button-label="Name"
                                                      helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>
                    <div class="col">
                        <label class="control-label" data-translate="Status"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="eoqAccessCtrl.filter.statusId">
                                <option value="">-- {{"All" | translate}} --</option>
                                <option value="1" data-translate="Nominated"></option>
                                <option value="2" data-translate="ShortedList"></option>
                                <option value="3" data-translate="Winner"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col button-block">
                        <button class="button" ng-click="eoqAccessCtrl.addNominee()" data-translate="AddNominee"></button>
                        <button class="button btnExcel">Excel</button>
                        <a href="" ng-click="eoqAccessCtrl.openPopupInformation()"><i class="fa fa-info-circle"></i></a>
                    </div>
                </div>
            </form>

            <table class="table table-bordered table-striped" ng-show="eoqAccessCtrl.period.Period.RoleId === eoqAccessCtrl.NOMINATOR">
                <thead>
                    <tr class="headerName">
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="Nominee"></th>
                        <th data-translate="Team"></th>
                        <th data-translate="Status"></th>
                        <th data-translate="Action"></th>
                    </tr>
                </thead>
                <tbody ng-show="eoqAccessCtrl.eoqNominations.length === 0">
                    <tr>
                        <td colspan="6" class="empty-result" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
                <tbody ng-show="eoqAccessCtrl.eoqNominations.length > 0">
                    <tr ng-repeat="item in eoqAccessCtrl.eoqNominations">
                        <td class="text-center">{{$index + 1}}</td>
                        <td>{{item.Nominee.FullName}} ({{item.Nominee.NickName}})</td>
                        <td class="text-center">{{item.Nominee.Group.GroupName}}</td>
                        <td class="text-center">{{item.StatusToString}}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <a class="fa fa-search" title="ViewDetail"
                                   ng-click="eoqAccessCtrl.viewNomination(item.Nominations[0])"></a>
                                <a class="fa fa-pencil-square-o icon-edit" title="Edit"
                                   ng-click="eoqAccessCtrl.updateNomination(item.Nominations[0])"></a>
                                <a class="fa fa-trash-o icon-remove" title="Delete"
                                   ng-click="eoqAccessCtrl.deleteNomination(item.Nominations[0])"></a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-bordered table-striped" ng-show="eoqAccessCtrl.period.Period.RoleId === eoqAccessCtrl.IN_BOARD_ROLE">
                <thead>
                    <tr class="headerName">
                        <th data-translate="SymbolCount"></th>
                        <th data-translate="Nominee"></th>
                        <th data-translate="Nominator"></th>
                        <th data-translate="Team"></th>
                        <th data-translate="Status"></th>
                        <th data-translate="Action"></th>
                    </tr>
                </thead>
                <tbody ng-show="eoqAccessCtrl.eoqNominations.length === 0">
                    <tr>
                        <td colspan="6" class="empty-result" data-translate="EmptyResult"></td>
                    </tr>
                </tbody>
                <tbody ng-show="eoqAccessCtrl.eoqNominations.length > 0">
                </tbody>
            </table>
        </div>
    </div>
</div>
