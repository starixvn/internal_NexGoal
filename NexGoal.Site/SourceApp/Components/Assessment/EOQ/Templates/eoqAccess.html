<div ng-controller="EOQAccessController as eoqAccessCtrl">
    <div class="row">
        <div class="col-sm-12 sub-header">
            <ul class="row breadcrumb">
                <li class="current">Update Name Later</li>
            </ul>
        </div>

        <div class="col-sm-12">

            <form novalidate class="form-inline filter">

                <div class="form-group">

                    <div class="col">
                        <label class="control-label" data-translate="Keyword"></label>
                        <div class="control-content">
                            <input class="form-control" placeholder="Enter full name or nick name"
                                   ng-model="eoqAccessCtrl.filter.query" />
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Team"></label>
                        <div class="control-content">
                            <add-class-to-role-filter class="multi-select" multi-select input-model="eoqAccessCtrl.teams" button-label="Name"
                                                      helper-elements="all reset filter" item-label="Name" tick-property="ticked" group-property="msGroup" max-labels="0">
                            </add-class-to-role-filter>
                        </div>
                    </div>

                    <div class="col">
                        <label class="control-label" data-translate="Status"></label>
                        <div class="control-content">
                            <select class="form-control" ng-model="eoqAccessCtrl.filter.statusId">
                                <option value="">-- {{"All" | translate}} --</option>
                                <option value="0" data-translate="Winner"></option>
                                <option value="1" data-translate="Nominated"></option>
                                <option value="2" data-translate="ShortedList"></option>
                            </select>
                        </div>
                    </div>

                    <div class="col button-block">
                        <button class="button" ng-click="eoqAccessCtrl.addNominee()" data-translate="AddNominee"></button>
                        <button class="button btnExcel">Excel</button>
                        <a href=""><i class="fa fa-info-circle"></i></a>
                    </div>

                </div>

            </form>

        </div>
    </div>
</div>
