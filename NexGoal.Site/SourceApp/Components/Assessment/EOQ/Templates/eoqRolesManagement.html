<div ng-controller="UpdateEOQRolesManagementController as eoqRolesManagementCtrl">

    <form novalidate class="form-inline filter">

        <div class="form-group">

            <div class="col">
                <label class="control-label" data-translate="Employee"></label>
                <div class="control-content">
                    <input class="form-control employe-search" placeholder="Enter full name or nick name" search-auto-complete
                           ng-model="eoqRolesManagementCtrl.searchEmployee"
                           search-employees="eoqRolesManagementCtrl.getEmployee()"
                           ng-change="eoqRolesManagementCtrl.unselectEmployee"
                           employee="eoqRolesManagementCtrl.filter.EmployeeId" />
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Team"></label>
                <div class="control-content">
                </div>
            </div>

            <div class="col">
                <label class="control-label" data-translate="Roles"></label>
                <div class="control-content">
                    <select class="form-control" ng-model="eoqRolesManagementCtrl.filter.RoleId">
                        <option value="">-- {{"All" | translate}} --</option>
                        <option value="0" data-translate="InBoard"></option>
                        <option value="1" data-translate="Nominator"></option>
                    </select>
                </div>
            </div>

            <div class="col">
                <div class="control-label size-xl">
                    <input type="checkbox" ng-model="eoqRolesManagementCtrl.filter.showAllEmployee" />
                    <label data-translate="ShowAllEmployee"></label>
                </div>
            </div>

            <div class="col button-block">
                <button class="button" ng-click="eoqRolesManagementCtrl.query()" data-translate="Search"></button>
            </div>

        </div>

    </form>

    <table class="table table-bordered table-striped">
        <thead>
            <tr class="header-table">
                <th colspan="7">
                    <input type="text" class="search-inline-textbox search pull-right"
                           ng-model="eoqRolesManagementCtrl.searchKey"
                           ng-change="eoqRolesManagementCtrl.search()" />
                </th>
            </tr>
            <tr class="headerName">
                <th data-translate="SymbolCount"></th>
                <th data-translate="NickName"></th>
                <th data-translate="FullName"></th>
                <th data-translate="JobTitle"></th>
                <th data-translate="Team"></th>
                <th data-translate="InBoard"></th>
                <th data-translate="Nominator"></th>
            </tr>
        </thead>
        <tbody>
            <tr dir-paginate="employee in eoqRolesManagementCtrl.filteredItems | itemsPerPage: eoqRolesManagementCtrl.pageSize"
                current-page="eoqRolesManagementCtrl.currentPage">
                <td class="text-center"
                    ng-bind="eoqRolesManagementCtrl.getIndex($index, eoqRolesManagementCtrl.currentPage, eoqRolesManagementCtrl.pageSize)"></td>
                <td class="text-center" ng-bind="employee.NickName"></td>
                <td ng-bind="employee.FullName"></td>
                <td ng-bind="employee.JobTitle"></td>
                <td class="text-center" ng-bind="employee.JobTitle"></td>
                <td class="text-center">
                    <input type="checkbox" ng-model="employee.InBoard" />
                </td>
                <td class="text-center">
                    <input type="checkbox" ng-model="employee.Nominator" />
                </td>
            </tr>
            <tr ng-show="eoqRolesManagementCtrl.filteredItems.length == 0">
                <td class="empty-result" colspan="7" data-translate="EmptyResult"></td>
            </tr>
        </tbody>
        <tfoot ng-show="eoqRolesManagementCtrl.filteredItems.length > 0">
            <tr>
                <td colspan="7" class="paging">
                    <span data-translate="Show"></span>
                    <select class="dropdown-entry" ng-model="eoqRolesManagementCtrl.pageSize"
                            ng-options="entry for entry in eoqRolesManagementCtrl.entries"></select>
                    <span data-translate="entries"></span>
                    <div class="pull-right custom-paging">
                        <dir-pagination-controls boundary-links="true"></dir-pagination-controls>
                    </div>
                </td>
            </tr>
        </tfoot>
    </table>

</div>
